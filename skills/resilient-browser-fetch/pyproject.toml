[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]
allowed-confusables = ["，", "；"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
include = ["scripts", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
extraPaths = ["scripts"]
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["scripts"]
