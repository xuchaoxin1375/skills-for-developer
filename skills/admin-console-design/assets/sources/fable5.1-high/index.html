<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Console UI Reference · Cloudflare-style dashboard design spec</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      (function () {
        try {
          var p = localStorage.getItem("cfui.theme");
          var dark = p === "dark" || ((!p || p === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
