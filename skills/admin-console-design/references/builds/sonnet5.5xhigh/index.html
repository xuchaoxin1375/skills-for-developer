> **一句话**：面向产品设计师与前端工程师，参考 Cloudflare 控制台的成熟设计，给出一套可直接对照、可交互验证的 **侧边栏（折叠 / 悬停展开 / 自动收起）** 与 **表单页** 设计规范、模拟设计稿和可复用实现。

本项目由三部分组成：**规范文档**（本目录）、**交互式设计稿**（Web 应用）、**参考实现**（\`src/\` 下的 React + Tailwind 代码）。三者相互印证：文档中的每一条规则都能在设计稿里找到对应的演示。

## 1. 文档地图

| 编号 | 文档 | 回答的问题 | 主要读者 |
| --- | --- | --- | --- |
| 01 | [设计思路与原则](01-design-principles.md) | 为什么这样设计？取舍是什么？页面骨架长什么样？ | 设计师、评审、产品 |
| 02 | [侧边栏规范](02-sidebar-spec.md) | 折叠 / 展开 / 悬停展开 / 自动收起如何定义、如何实现？ | 设计师、前端 |
| 03 | [表单页规范](03-form-spec.md) | 表单怎么布局、校验、保存、保护用户输入？ | 设计师、前端、测试 |
| 04 | [响应式与无障碍](04-responsive-a11y.md) | 如何在 300px 到 1920px 之间都不挤压、不溢出？ | 前端、测试 |
| 05 | [设计令牌](05-design-tokens.md) | 颜色、字号、间距、圆角、阴影、动效的取值？ | 设计师、前端 |
| 06 | [实践指南](06-best-practices.md) | 必须 / 应该 / 可以 / 避免分别是什么？ | 全体 |
| 07 | [部署与使用说明](07-usage-deploy.md) | 如何运行、构建、操作演示、迁移到自己的项目？ | 前端、使用者 |
| 08 | [交互式表格与条目规范](08-data-table-spec.md) | 列宽怎么调？批量与编辑怎么设计？列再多如何保证编辑入口可见？ | 设计师、前端、测试 |

## 2. 推荐阅读路径

- **设计师（30 分钟）**：先打开设计稿，体验侧边栏与表单；再读 01 → 02 的「状态机」与「动画」→ 03 的「校验」→ 05。
- **前端工程师（60 分钟）**：07 → 02 → 03 → 08 → 04，同时对照 \`src/dashboard/Sidebar.tsx\`、\`src/dashboard/pages/RecordForm.tsx\`、\`src/dashboard/pages/DnsRecords.tsx\`、\`src/ui/columns.tsx\`。
- **评审 / 测试**：直接使用 02、03、04 末尾的「检查清单」，配合设计稿的宽度扫描与「传统方案」对比模式。

## 3. 设计稿能做什么

| 能力 | 位置 | 说明 |
| --- | --- | --- |
| 宽度滑条 / 数值输入 / 常用宽度预设 | 舞台底部浮层 | 240px – 1920px，含 300 / 390 / 768 / 1024 / 1440 / 1920 |
| 宽度自动扫描（应力测试） | 浮层「宽度扫描」 | 在 280 – 1600px 往返，三档速度，快速发现挤压与溢出 |
| 侧边栏行为演示脚本 | 浮层「侧边栏行为演示」 | 自动循环：固定展开 → 折叠 → 悬停展开 → 自动收起，并显示说明 |
| 状态监视 | 浮层底部 | 实时显示布局档位与侧边栏状态（来自预览页的上报） |
| 查看模式 | 舞台顶部 | 改进方案 / 传统方案（反例）/ 并排对比 |
| 主题 | 页面右上角 | 浅色 / 深色 / 跟随系统（默认），同步到预览页 |
| 侧边栏手动控制 | 舞台底部浮层 | 「侧边栏展开 / 折叠为图标栏」分段按钮，与自动演示互补 |
| 场景切换 | 左侧可收起面板 | DNS 列表（交互式表格）、添加记录表单、设置页、分步向导、概览 |
| 独立打开 | 舞台顶部「新标签页打开」 | 脱离舞台，用真实浏览器窗口验证 |

## 4. 规范性用语

本文档遵循统一的用语约定，便于验收时逐条核对：

| 用语 | 含义 |
| --- | --- |
| **必须 / 不得** | 底线要求。违反会导致可用性、无障碍或数据安全问题，验收不通过 |
| **应该 / 不应** | 强烈推荐。仅在有充分理由并记录原因时才可偏离 |
| **可以** | 可选增强，视场景取舍 |
| **避免** | 已知的反模式，通常会引入缺陷或体验退化 |

## 5. 术语表

| 术语 | 含义 |
| --- | --- |
| Shell（外壳） | 由顶栏、侧边栏、内容区、页脚构成的应用骨架 |
| Rail（图标栏） | 侧边栏折叠后仅显示图标的 56px 窄栏 |
| Pinned（固定） | 用户通过切换按钮选择的常驻状态：展开或折叠，会被持久化 |
| Peek（悬停展开） | 折叠状态下的临时展开：覆盖在内容之上，不推动内容 |
| Hover intent（悬停意图） | 指针停留超过阈值才视为「想要展开」，用于过滤划过 |
| Slot（占位槽） | 侧边栏在文档流中占据的宽度，与其视觉宽度解耦 |
| 粘性列 | 表格中用 \`position: sticky\` 固定在左 / 右边缘的列（勾选列、操作列） |
| 填充列 | 表格里一列不设宽度的 \`<col />\`，吸收多余空间，使其他列保持用户设置的精确宽度 |
| 行内展开编辑 | 点击 Edit 后在该行下方展开编辑区（相对于弹窗编辑而言） |
| Drawer（抽屉） | 窄屏下由汉堡按钮打开的模态侧边栏 |
| 容器查询 | 依据组件所在容器宽度（而非视口）切换布局的 CSS 能力 |
| 两级校验 | 第一级：字段失焦即时校验；第二级：提交时整体校验并汇总 |
| 首错聚焦 | 提交失败后把焦点移动到第一个出错字段 |

## 1. 背景与目标

Cloudflare 控制台是业界公认较成熟的运维类产品界面：信息密度高，但学习成本低；功能入口多，但导航稳定；表单复杂，但很少让用户感到迷路。本项目不复刻其视觉品牌，而是 **提炼其结构与交互逻辑**，沉淀为可复用的规范：

1. 让桌面端用户在**宽屏**下获得稳定的导航，并能把空间还给内容；
2. 让折叠的侧边栏**不牺牲可发现性**——悬停即可优雅展开，移开即自动隐藏；
3. 让表单页在**任意窗口宽度**下都清晰、可预期、不丢输入；
4. 所有规则可验收、可演示、可迁移。

## 2. 对参考对象的观察

通过对 Cloudflare 控制台（DNS 记录页）的截图分析，归纳出以下可迁移的特征：

| 区域 | 观察到的设计 | 提炼出的规则 |

### 3.1 任务清晰

- 每个页面用**一句话**说明用户、任务与下一步；首屏只做一件事，主操作不超过 3 个。
- 字段超过 7 项时，必须分组或分步；危险操作远离首屏并二次确认。

### 3.2 布局克制

页面只在四种原型中选择，不混搭：

| 原型 | 适用 | 设计稿对应 |
| --- | --- | --- |
| 仪表盘 | 指标总览、待办清单 | 概览页 |
| 列表 + 详情 | 资源管理、批量操作 | DNS 记录列表 + 编辑页 |
| 表单单列 | 创建 / 编辑一个对象 | 添加 DNS 记录、添加站点（向导） |
| 设置页 | 多项配置，分区保存 | SSL/TLS 设置 |

间距只使用 4 / 8 / 12 / 16 / 24 / 32 / 48；先画线框确认结构，再写样式。

### 3.3 状态可预期

- 任何控件都有清晰的默认、悬停、聚焦、按下、禁用、错误、加载状态。
- 同一个动作在任何入口得到同一个结果（例如侧边栏的折叠按钮、\`[\` 快捷键、命令面板中的「Toggle sidebar」完全等价）。
- 用户偏好（侧边栏固定状态、主题）被记住。

### 3.4 渐进披露

- 低频功能收进浮层（筛选、显示选项）；次要列在窄容器中自动隐藏；
- 复杂表单按块分组，条件字段（如 MX 的优先级）仅在相关时出现。

### 3.5 键盘与触屏同等重要

- 任何仅靠悬停才能使用的功能，必须有键盘 / 触屏等价路径：悬停展开的侧边栏同样会在键盘聚焦时展开，触屏用按钮展开；
- 触控目标不小于 24px，窄屏与触屏提升到 44px。

## 4. 页面骨架（Shell）

\`\`\`text
┌────────┬──────────────────────────────────────────────┐
│        │ Topbar（sticky，56px）：菜单 · 站点上下文 · 操作 │
│ Side   ├──────────────────────────────────────────────┤
│ bar    │ Page（max 1440，居中）                         │
│ 56/240 │   PageHeader（标题 / 说明 / 次要操作）          │
│ (sticky│   Banner（可选）                               │
│  100dvh│   Toolbar / Content                           │
│ )      │   ActionBar（表单页：sticky bottom）            │
│        ├──────────────────────────────────────────────┤
│        │ Footer（低强调）                                │
└────────┴──────────────────────────────────────────────┘
窄屏（<768）：Sidebar 变为抽屉，Topbar 左侧出现汉堡按钮

关键决定：

- 页面使用**文档级滚动**（而非内部滚动容器），以保留浏览器原生的滚动恢复、地址栏收缩与锚点行为；侧边栏与顶栏使用 \`position: sticky\`。

## 5. 关键取舍

| 决策 | 选择 | 理由 | 代价 |
| --- | --- | --- | --- |
| 折叠态悬停展开方式 | **覆盖**内容，不推挤 | 推挤会让内容区每次划过都重排，表格与图表抖动 | 覆盖时遮住一部分内容（有阴影分层） |

> 适用范围：宽屏桌面端的应用级主导航。目标是 **常驻时稳定、折叠时省空间、悬停时自动展开、移开后自动收起**，并保证键盘与触屏用户同样可用。

对应实现：\`src/dashboard/Sidebar.tsx\`（状态机与组件）、\`src/index.css\` 中 \`.sb*\` 样式。

## 1. 结构与尺寸

\`\`\`text
.sb-slot   ← 文档流中的占位槽：宽 56 或 240（sticky，100dvh），决定内容区可用宽度
 └─ nav.sb ← 绝对定位的真实侧边栏：宽 56 → 240（过渡），可覆盖内容
     ├─ .sb-head    Logo（高度与顶栏一致：56px，底部分隔线对齐顶栏）
     ├─ .sb-scroll  导航列表（纵向滚动，折叠态隐藏滚动条）
     └─ .sb-foot    设置 / 折叠切换按钮
\`\`\`

| 项 | 取值 |
| --- | --- |
| 展开宽度 | 240px |
| 图标栏宽度 | 56px（8 + 40 + 8，图标恰好居中） |
| 导航项高度 | ≥ 40px；子项 ≥ 36px |
| 图标 | 18px，统一图标库（Lucide），描边风格 |
| 分隔 | 1px 边框色，上下 8px 间距 |

**必须**把「占位槽」与「视觉宽度」解耦：槽宽只由用户的固定偏好决定；视觉宽度由「固定偏好 ∪ 临时悬停展开」决定。

### 1.1 图标栏（折叠态）的视觉规范

| 规则 | 要求 | 实现 |
| --- | --- | --- |
| 图标严格居中 | 图标中心在 56px 带的正中（x = 28） | 侧边栏容器 padding 8 + 导航项 padding 8 + 图标 24 → 中心 = 28；**右侧分隔线用 \`::after\` 伪元素绘制，不占用盒模型宽度**，否则内容区只有 55px，图标会偏 0.5px |
| 文字不显示、不外露 | 折叠态不得出现任何文字片段、徽标、快捷键提示、箭头 | 标签宽度被压缩到 0（\`flex:1; min-width:0; overflow:hidden\`）+ \`opacity: 0\`；徽标 / 箭头 / 键帽使用 \`.sb-fade\`（透明且 \`pointer-events:none\`）；外层 \`overflow: hidden\` 兜底 |
| 读屏仍可读 | 文字只是视觉隐藏，名称仍在 DOM 中 | 不使用 \`display:none\` / \`visibility:hidden\` 隐藏标签 |
| 无滚动条 | 滚动条不得挤压 40px 的内容宽度 | 折叠态 \`scrollbar-width: none\` |
| 悬停背景 | 悬停 / 当前项背景是 40px 宽的圆角块，位于带内居中 | 与图标同一容器，无额外 margin |

### 1.2 手动控制（不只靠自动判断）

自动适配（按视口宽度切换布局档位）只是**默认值**，用户必须始终能手动控制：

| 布局档位 | 手动控制入口 | 效果 |
| --- | --- | --- |

| medium（768 – 1023） | 同一个底部按钮 | 临时展开 ⇄ 收起（覆盖式） |
| narrow（< 768） | 顶栏汉堡按钮；抽屉内关闭按钮 | 打开 ⇄ 关闭抽屉 |

## 2. 状态模型

| 状态量 | 类型 | 含义 | 持久化 |
| --- | --- | --- | --- |
| \`pinned\` | \`expanded\` / \`collapsed\` | 用户选择的常驻状态 | 是（\`localStorage\`） |
| \`hover\` | boolean | 指针悬停意图成立 | 否 |
| \`kbFocus\` | boolean | 键盘焦点（\`:focus-visible\`）进入侧边栏 | 否 |
| \`forced\` | boolean | 触屏 / 中等宽度下的显式临时展开 | 否 |
| \`suppressed\` | boolean | 刚点击「收起」后，抑制再次悬停展开 | 否 |
| \`drawer\` | boolean | 窄屏抽屉是否打开 | 否 |

派生量（\`layout\` 为 \`wide\` / \`medium\` / \`narrow\`）：

\`\`\`text
rail     = layout == medium  ||  (layout == wide && pinned == collapsed)
peek     = rail && ((!suppressed && (hover || kbFocus)) || forced)
expanded = wide   ? (pinned == expanded || peek)
         : medium ? peek
         : false
slotWidth= wide ? (pinned == expanded ? 240 : 56) : medium ? 56 : 0
overlay  = expanded && slotWidth < 240        // 需要阴影以区分层级
\`\`\`

## 3. 响应式行为矩阵

| 布局档位 | 视口宽度 | 常驻形态 | 展开方式 | 切换按钮 |
| --- | --- | --- | --- | --- |
| wide | ≥ 1024px | 展开 240 或图标栏 56（用户选择，被记住） | 折叠态：悬停 / 键盘聚焦 → 覆盖式展开 | 固定 / 取消固定 |
| medium | 768 – 1023px | 图标栏 56 | 悬停 / 聚焦 / 按钮 → 覆盖式展开；点击外部或 Esc 关闭 | 临时展开 |
| narrow | < 768px | 无（隐藏） | 顶栏汉堡按钮 → 模态抽屉 | 打开 / 关闭抽屉 |

## 4. 悬停展开与自动收起

### 4.1 时序

\`\`\`text
指针进入 ──120ms──▶ hover=true  ──▶ 宽度 56→240（220ms）
指针离开 ──250ms──▶ hover=false ──▶ 宽度 240→56（220ms）
\`\`\`

- **进入延迟 120ms**：过滤鼠标划过屏幕边缘的误触，避免「一碰就弹」。
- **离开延迟 250ms**：容忍鼠标短暂滑出、抖动或穿过边界；在延迟内重新进入则取消收起。
- 进入 / 离开事件使用 \`pointerenter\` / \`pointerleave\`，并**忽略 \`pointerType === "touch"\`**（触屏没有悬停）。

### 4.2 覆盖而非推挤

折叠态悬停展开时，侧边栏覆盖在内容上方，\`z-index\` 高于顶栏，并加上 \`shadow-2\` 区分层级；**内容区宽度不变**，不会发生重排。

### 4.3 抑制规则（防「点了收起又弹出来」）

用户点击「Collapse sidebar」时指针仍停在侧边栏上。若不处理，指针仍处于 hover 状态，侧边栏会立刻再次展开。规则：

1. 点击收起：\`hover=false\`、\`kbFocus=false\`，并在指针仍位于侧边栏内时设置 \`suppressed=true\`；
2. 指针**离开一次**侧边栏后，\`suppressed\` 复位；
3. 若收起由键盘或快捷键触发（指针不在侧边栏内），**不得**设置 \`suppressed\`，否则之后将无法再悬停展开。

### 4.4 键盘等价

- Tab 进入侧边栏且焦点可见（\`:focus-visible\`）时视同悬停，侧边栏展开；焦点移出后收起。
- 鼠标点击产生的焦点（非 \`:focus-visible\`）**不应**触发展开，避免点击后卡在展开态。

### 4.5 触屏与中等宽度

- 触屏没有悬停：点击图标栏上的分组图标会临时展开（\`forced\`），点击外部、按 Esc 或导航后关闭。
- 中等宽度的切换按钮切换 \`forced\`。

## 5. 动画规范

| 属性 | 时长 | 缓动 | 说明 |
| --- | --- | --- | --- |
| 侧边栏宽度 | 220ms | \`cubic-bezier(.2,.8,.2,1)\` | 先快后缓；仅动画 \`width\` 与 \`box-shadow\` |
| 占位槽宽度（固定切换） | 220ms | 同上 | 与侧边栏同步，内容区平滑让位 |
| 标签 / 徽标 / 箭头 | 160ms 透明度 + 220ms 位移 | ease / 同上 | 展开时延迟 50ms 出现，折叠时立即淡出，避免文字被截断闪烁 |
| 分组子菜单 | 220ms | 同上 | 使用 \`grid-template-rows: 0fr → 1fr\`，无需测量高度 |
| 阴影 | 220ms | 同上 | 覆盖态才出现 |

要点：

- 侧边栏内部宽度**随外层流式变化**（\`width: 100%\`），文字用 \`overflow: hidden; white-space: nowrap\` 裁切；**不要**给内容写死 240px，否则折叠态的悬停背景会超出可视区。
- 子菜单折叠使用 \`visibility: hidden\`（带延迟过渡）把收起的链接移出 Tab 顺序。
- **必须**尊重 \`prefers-reduced-motion: reduce\`：将动画缩短到近似 0。
- 只对 \`width / opacity / transform / grid-template-rows / box-shadow\` 做动画，**避免** \`height: auto\` 或 \`left/top\`。

## 6. 导航项规则

| 类型 | 元素 | 规则 |
| --- | --- | --- |
| 链接项 | \`<a>\`（路由 Link） | 当前页 \`aria-current="page"\`，背景加深 + 字重 600 |
| 分组项 | \`<button aria-expanded aria-controls>\` | 展开时显示子列表；折叠态点击先展开侧边栏 |
| 子项 | 缩进 + 左侧竖线 | 当前子项高亮；分组仅在折叠态下因子项激活而高亮图标 |
| 命令项 | \`<button>\` | 如「Quick search」，不是路由 |
| 徽标 | \`badge\` | 如 New，折叠态淡出 |

分组默认只展开包含当前页的一组；路由变化时自动展开包含当前页的分组。

## 7. 键盘与无障碍

| 操作 | 行为 |
| --- | --- |
| \`[\` | 切换侧边栏固定状态（在输入控件中不触发；窄屏无效） |
| \`Ctrl/⌘ + K\` | 打开快速搜索 / 命令面板 |
| \`Tab\` | 依次聚焦导航项；折叠态聚焦时自动展开 |
| \`Esc\` | 关闭临时展开 / 抽屉 |
| \`Enter / Space\` | 激活链接或分组 |

必须满足：

- 容器使用 \`<nav aria-label="Primary">\`；切换按钮的可访问名称随状态变化（Collapse sidebar / Expand sidebar）并提供 \`aria-keyshortcuts\`——**不要同时**使用会变化的名称与 \`aria-expanded\`，否则读屏会重复播报；分组按钮使用 \`aria-expanded\` + \`aria-controls\`；
- 图标按钮必须有可访问名称；折叠态的文字只是视觉隐藏，仍在 DOM 中，读屏可读；
- 窄屏抽屉使用原生 \`<dialog>\` + \`showModal()\`：自带焦点陷阱、Esc、背景 inert，关闭后焦点回到汉堡按钮；
- 提供「跳到主内容」跳过链接（聚焦时可见）；
- 路由切换后把焦点移到主内容区，并滚动到顶部。

## 8. 实现要点与常见坑

1. **槽宽与视觉宽度解耦**：否则悬停展开会推动内容。
2. **hover 只在 rail 状态记录**：固定展开时忽略，避免之后折叠瞬间误弹。
3. **toggle 后清理计时器与状态**：进入 / 离开计时器必须在卸载与切换时清除。
4. **\`:focus-visible\` 判断**：使用 \`e.target.matches(":focus-visible")\`。
5. **指针类型**：\`pointerType === "touch"\` 直接返回。
6. **滚动**：导航列表单独滚动并 \`overscroll-behavior: contain\`，避免滚动穿透到页面。
7. **折叠态隐藏滚动条**，否则 40px 内容宽度会被滚动条挤压。
8. **模态层与悬停**：打开命令面板时指针离开侧边栏属正常，侧边栏随之收起。
9. **持久化失败**（隐私模式）时静默降级为内存状态。

## 9. 检查清单（验收）

- [ ] 宽屏下可以固定展开 / 折叠，刷新后保持；每个布局档位都有手动控制入口
- [ ] 图标栏中的图标在 56px 带内水平居中；折叠态看不到任何文字、徽标、箭头
- [ ] 折叠态悬停约 120ms 后展开，覆盖内容且内容区无重排
- [ ] 移开约 250ms 后自动收起；快速划过不会展开
- [ ] 点击「收起」后指针仍在栏内时不会立刻再次弹出；移出再进入后恢复悬停
- [ ] 用键盘 Tab 进入时展开，离开后收起；鼠标点击不会触发展开
- [ ] 分组展开 / 收起动画顺滑，收起的子项不可被 Tab 聚焦
- [ ] 768 – 1023px 为图标栏，可临时展开，点击外部关闭
- [ ] < 768px 为抽屉：焦点陷阱、Esc 关闭、遮罩点击关闭
- [ ] 开启「减少动态效果」后无明显动画
- [ ] 侧边栏文字在 320px 抽屉中无溢出

## 10. 在设计稿中验证

1. 打开「设计稿」，选择任意场景；
2. 点击浮层中的 **「侧边栏行为演示」**，观察自动循环的四个阶段与说明文字；
3. 手动操作：在预览中按 \`[\` 折叠，把鼠标移上去再移开；
4. 拖动宽度滑条或使用「宽度扫描」，观察 1024 / 768 两个切换点；
5. 切换到 **「并排对比」**，对照「传统方案」固定侧边栏在窄屏下的挤压。
`,X2=`# 03 · 表单页规范

> 适用范围：创建 / 编辑对象的单列表单、设置页、分步向导。目标是 **布局合理、校验可预期、不丢用户输入、窄屏同样好用**。

对应实现：\`src/dashboard/pages/RecordForm.tsx\`（单列表单）、\`Settings.tsx\`（设置页）、\`AddSite.tsx\`（向导）、\`src/ui/controls.tsx\`（字段组件）。

## 1. 页面类型与选择

| 类型 | 何时使用 | 布局 | 设计稿场景 |
| --- | --- | --- | --- |
| 单列表单 | 创建 / 编辑一个对象，字段 ≤ 7 个或可分 2 – 3 组 | 单列卡片，最大宽 720px | 添加 DNS 记录 |
| 设置页 | 多个相互独立的配置项 | 行布局：左说明、右控件；窄容器堆叠 | SSL/TLS |
| 向导 | 字段多、有先后依赖、一次性流程 | 每步一个任务，顶部 Stepper | 添加站点 |

字段超过 7 项时**必须**分组或分步，不得把所有字段平铺在一屏。

## 2. 页面结构

\`\`\`text
Breadcrumbs（面包屑：层级与返回路径）
PageHeader  （标题 + 一句话说明）
┌ Form Card ─────────────────────────────┐
│ 错误汇总（仅提交失败后出现，role=alert）   │
│ 必填说明："带 * 的字段为必填"              │
│ Fieldset「Record」  字段 …                │
│ Fieldset「Routing and caching」 …         │
│ Fieldset「Notes」 …                       │
│ 预览（只读输出，可选）                     │
├────────────────────────────────────────┤
│ ActionBar（sticky bottom）：未保存提示 · 取消 · 保存 │
└────────────────────────────────────────┘
\`\`\`

- **主操作唯一**：保存在右侧，使用主色；取消为次要样式。
- **操作栏粘性固定在底部**，长表单也始终可见；窄屏下按钮自动均分一行。
- 容器宽度 ≥ 1040px 时，右侧出现帮助侧栏（取决于内容区而非视口，因此会随侧边栏展开 / 折叠而变化）。

## 3. 布局规则

| 规则 | 要求 |
| --- | --- |
| 单列 | 字段纵向排列；仅「天然成对」的短字段（如日期范围）可同行 |
| 宽度 | 表单卡片最大 720px；短字段（类型、TTL、优先级）限制为 \`max-w-xs\` |
| 分组 | \`<fieldset>\` + \`<legend>\`；组间 24px，并用 1px 分隔线 |
| 间距 | 字段间 16px，分组间 24px，卡片内边距 24px（窄屏 16px） |
| 条件字段 | 仅在相关时出现（MX 才出现优先级）；切换类型时清理不适用的内容 |
| 提示位置 | 标签 → 控件 → 辅助说明 → 错误；错误紧贴控件下方 |

## 4. 字段规则

### 4.1 标签与提示

- **必须**使用可见的 \`<label>\`；**不得**用 placeholder 代替标签（输入后即消失、对比度低、读屏体验差）。
- 必填字段在标签后加 \`*\`（\`aria-hidden\`），并在表单顶部说明含义；同时设置 \`aria-required\`。
- 选填字段标注 \`Optional\`；不要把必填 / 选填都用颜色区分。
- 辅助说明（hint）用于格式、约束、后果，通过 \`aria-describedby\` 关联。
- placeholder 仅用于**示例值**（如 \`192.0.2.1\`），颜色使用次要文字色，对比度仍需 ≥ 4.5:1；输入后即消失，因此**不得**承载必要信息。

### 4.2 输入类型与行为

| 场景 | 做法 |
| --- | --- |
| 邮箱 / URL / 数字 | 使用合适的 \`type\` 与 \`inputMode\`（邮箱用 \`type=email\`，数字用 \`inputMode=numeric\`） |
| 标识符 / 主机名 | \`autoCapitalize="none"\`、\`spellCheck={false}\` |
| 自动填充 | 设置正确的 \`autoComplete\`（如邮箱 \`email\`）；非用户资料类字段关闭 |
| 允许粘贴 | **必须**允许粘贴；并对粘贴内容做**规范化**（去首尾空白、完整主机名缩写、URL 取域名） |
| 移动端 | 窄屏输入框字号 16px，避免 iOS 聚焦自动放大；**不得**禁用缩放 |

### 4.3 控件选择

| 数据 | 控件 |
| --- | --- |
| 开关量（立即生效） | Switch（\`role="switch"\`） |
| 2 – 5 个互斥且需要解释 | 单选卡片（\`radiogroup\`） |
| 互斥且较多 | 原生 Select（移动端体验最好） |
| 多选 | 复选框组（\`fieldset\` + \`legend\`） |
| 长文本 | Textarea，带字数提示 |

## 5. 校验

### 5.1 两级校验

| 级别 | 时机 | 范围 | 展示 |
| --- | --- | --- | --- |
| 第一级（字段级） | 字段**失焦**后；之后每次输入即时更新 | 格式、必填、长度 | 字段下方的行内错误 |
| 第二级（提交级） | 点击保存 | 全部字段 + 跨字段规则 | 顶部错误汇总 + 行内错误；焦点移到第一个错误字段 |
| 服务端级（可选） | 提交后返回 | 唯一性、冲突、权限 | 映射回对应字段；无法映射时显示在汇总中 |

原则：**晚惩罚、早奖励**——用户输入过程中不打断；失焦后才报错；一旦报错，修正时立即消除。

### 5.2 首错聚焦与错误汇总

1. 提交失败时，按 DOM 顺序找到第一个出错字段，调用 \`focus()\`（并通过 \`scroll-padding\` 避免被粘性栏遮挡）；
2. 同时显示错误汇总（\`role="alert"\`），列出全部问题，每条可点击跳转到字段；
3. **已填写的内容必须全部保留**，不得清空表单；
4. 汇总标题写明数量：「2 个问题需要处理」。

### 5.3 错误文案公式

> **哪里错了 + 为什么 + 如何修正**，使用具体示例，不使用「输入无效」。

| 反例 | 正例 |
| --- | --- |
| Invalid input | Enter a valid IPv4 address, for example 192.0.2.1. |
| Error | A CNAME record cannot share a name with other records. “www.myexample.com” already has an A record. |
| Required | Enter a name. Use @ for the root domain. |

### 5.4 无障碍关联

- 出错控件设置 \`aria-invalid="true"\`，并通过 \`aria-describedby\` 指向错误文案；
- 行内错误使用 \`role="alert"\`，在出现时被读屏播报；
- 错误不得**只**依靠颜色表达：同时有图标与文字、边框加粗。

## 6. 状态与反馈

| 状态 | 表现 |
| --- | --- |
| 默认 / 悬停 / 聚焦 | 边框加深 / 2px 聚焦环（偏移 2px），**不得**移除 outline 而无替代 |
| 错误 | 红色边框 + 图标 + 文案 |
| 禁用 | 仅用于「因其他选择而不适用」，并必须在旁边**说明原因**（如代理开启时 TTL 固定为 Auto） |
| 保存中 | 按钮显示 Spinner 与「Saving…」，\`aria-busy\`；使用 \`aria-disabled\` 并在提交函数里防重复，保持焦点不丢失 |
| 成功 | 非阻塞通知（Toast，\`aria-live=polite\`）+ 回到列表并高亮新记录 |
| 失败 | 保留输入，错误映射回字段，焦点移到相关字段 |

**不得**用「禁用提交按钮」代替校验：用户无法得知为什么不能提交。

## 7. 保存策略

| 策略 | 适用 | 示例 | 必须说明 |
| --- | --- | --- | --- |
| 显式保存 | 多字段、有依赖、可能出错 | 添加 / 编辑记录、加密模式 | 修改后出现保存条；提供「放弃」 |
| 即时生效 | 单一开关、可逆、低风险 | Always use HTTPS | 在描述中写明「立即生效」，并给出通知 |

两者**不应**混在同一分区内；若同页并存，必须从文案上区分。

## 8. 离开保护

- 表单有未保存修改（\`dirty\`）时：
  - 站内导航（侧边栏、面包屑、取消）弹出确认对话框：「放弃未保存的修改？」默认焦点在「继续编辑」；
  - 刷新 / 关闭标签页使用 \`beforeunload\`。
- 保存成功后立即解除保护，否则跳转会被自己拦截。
- 确认对话框使用原生 \`<dialog>\`，默认焦点在非破坏性按钮上。

## 9. 危险操作

- 放在页面底部独立区域，使用危险色描边，**远离首屏**；
- 必须二次确认；高风险（删除站点）要求**输入对象名称**确认；
- 确认按钮**保持可点击**，输入不匹配时通过校验信息说明，而不是禁用；
- 可撤销的操作（删除记录）提供「撤销」通知，且停留时间更长（8 秒）。

## 10. 向导（分步表单）

- 每步只做一件事；顶部 Stepper 使用 \`<ol>\` + \`aria-current="step"\`；
- 窄屏下 Stepper 退化为「Step 2 of 3：Plan」文字 + 进度条；
- 切换步骤时焦点移动到步骤标题（\`tabIndex=-1\`），读屏用户知道已进入新步骤；
- 「Continue」按步校验；最后一步为 Review，汇总并允许逐项回改；
- 步骤间的输入**不得丢失**；中途离开有保护。

## 11. 响应式表现

| 宽度 | 表现 |
| --- | --- |
| 容器 ≥ 1040px | 表单 + 右侧帮助侧栏 |
| 720 – 1039px | 单列表单；设置页行布局左右分栏 |
| < 720px | 设置页堆叠；短字段占满宽度（\`max-w-xs\` 在 < 640 时无意义） |
| < 640px | 控件高度 44px、字号 16px；操作栏按钮均分整行 |
| 300px | 无横向滚动；长文本使用 \`break-words\` / \`overflow-wrap:anywhere\`；预览块在自身内部换行 |

## 12. 传统方案 vs 改进方案

设计稿的「传统方案」刻意保留了常见缺陷，可用「并排对比」逐项观察：

| 维度 | 传统方案 | 改进方案 |
| --- | --- | --- |
| 标签 | 仅 placeholder | 可见标签 + 说明 |
| 布局 | 所有字段横排一行，固定宽度 | 单列分组，流式宽度 |
| 校验 | 提交按钮置灰；错误只写「Error」 | 两级校验，具体文案，首错聚焦 |
| 保存 | 无防重复；无反馈 | Spinner、通知、列表高亮 |
| 离开 | 直接丢失 | 未保存确认 |
| 窄屏 | 横向溢出 | 单列，操作栏均分 |

## 13. 检查清单（验收）

- [ ] 每个控件都有可见标签；必填有标记和说明
- [ ] 可以粘贴；粘贴的完整主机名 / URL 被规范化
- [ ] 未填写直接提交：出现汇总，焦点在第一个错误字段，已填内容保留
- [ ] 失焦前不提前报错；失焦后随输入实时更新
- [ ] 错误文案包含原因与修正方式
- [ ] 保存按钮在校验失败时仍可点击；保存中防重复提交
- [ ] 修改后离开会确认；保存后不会被拦截
- [ ] 危险操作在页面底部，且需要二次确认
- [ ] 300 / 390 / 768 / 1440 宽度下均无横向滚动，操作栏可见
- [ ] 全键盘可完成：Tab 顺序合理，焦点环可见

> 目标：在 **300px 到 1920px** 的任意宽度下，页面级无横向滚动、元素不挤压、不溢出；满足无障碍底线。

## 1. 验证宽度

| 宽度 | 代表设备 | 布局档位 | 必须验证的内容 |
| --- | --- | --- | --- |
| 300 / 320 | 极窄窗口、折叠屏外屏、400% 缩放 | narrow | 320px 可回流；无横向滚动；按钮不重叠 |
| 390 | 主流手机 | narrow | 抽屉、卡片列表、单列表单、44px 控件 |
| 768 | 平板竖屏 | medium | 图标栏 + 临时展开；表格列收敛 |
| 1024 | 小笔记本 | wide（临界） | 固定展开 / 折叠切换；内容区宽度变化 |
| 1440 | 桌面 | wide | 完整表格；帮助侧栏出现 |
| 1920 | 宽屏 | wide | 内容 \`max-width: 1440\` 居中，不无限拉伸 |

设计稿提供宽度滑条、预设与「宽度扫描」。**至少**在 390 / 768 / 1440 三个宽度验证，并用 300 做极端测试。

## 2. 断点策略：外壳用媒体查询，内容用容器查询

| 层 | 使用 | 原因 | 取值 |
| --- | --- | --- | --- |
| 外壳（侧边栏、顶栏） | 媒体查询 / \`matchMedia\` | 取决于设备与窗口 | 1024 / 768（及 640、480 的细节） |
| 内容组件（表格、表单、设置页） | **容器查询** | 侧边栏展开 / 折叠会改变内容区宽度，视口断点无法覆盖 | 见下表 |

| 组件 | 容器宽度 | 行为 |
| --- | --- | --- |
| DNS 记录表 | ≥ 700px | 表格；列宽可调，总宽超出时在表格容器内横向滚动，首列勾选 / 末列操作粘性固定（见 08） |
| | < 700px | 整体切换为卡片列表（由 \`ResizeObserver\` 判断，仅渲染一种形态） |
| 表单页 | ≥ 1040px | 出现右侧帮助侧栏 |
| 设置页 | ≥ 720px | 行内左说明右控件；否则堆叠 |

**应该**：宽表格优先保证**关键操作常驻**（勾选、编辑用粘性列固定），其余列在容器内横向滚动并允许用户调列宽 / 隐藏次要列；容器过窄时改用卡片，而不是整体等比缩小。

## 3. 防溢出清单

| 问题 | 对策 |
| --- | --- |
| Flex / Grid 子项撑破容器 | 给可收缩子项加 \`min-width: 0\`（Tailwind：\`min-w-0\`） |
| 长域名 / 长文本 | \`overflow-wrap: anywhere\`（单元格）、\`break-words\`（标题） |
| 表格过宽 | 表格放入自己的 \`overflow-x: auto\` 容器，容器可聚焦并有标签；页面本身不滚动；操作列粘性固定在右侧 |
| 按钮并排放不下 | \`flex-wrap\`；窄屏下次要文字改为 \`sr-only\`，只保留图标（保持可访问名称） |
| 浮层超出视口 | 打开时测量并夹取到视口内；< 640px 变为底部面板 |
| 固定宽度 | 避免 \`width: 480px\`；使用 \`min(480px, calc(100vw - 16px))\` |
| 图片 / 媒体 | \`max-width: 100%\` |
| 兜底 | 应用根节点 \`overflow-x: clip\`（不破坏 sticky），但**不得**用它掩盖真实溢出 |

## 4. 极窄窗口（≤ 320px）处理

1. 顶栏：隐藏次要入口（< 640 隐藏 Ask AI；< 480 隐藏 Support 与套餐徽标），域名使用省略号；
2. 页头：标题与操作区 \`flex-wrap\`，操作区自动换到下一行；
3. 工具栏：搜索框独占一行，按钮自动换行；
4. 表单：字段 100% 宽；操作栏按钮 \`flex: 1 1 120px\`；
5. 对话框：\`width: min(480px, 100vw − 16px)\`，内部内边距不变；
6. 抽屉：\`min(288px, 100vw − 48px)\`，保证右侧留出遮罩可点区域；
7. 文案：不依赖单行显示；英文长单词可断行。

## 5. 触控目标

| 场景 | 最小尺寸 |
| --- | --- |
| 桌面指针设备 | 24 × 24px（WCAG 2.2 AA），默认控件 36px |
| 触屏或窄屏（< 640px） | 44 × 44px（\`--control-h: 44px\`，由媒体查询 \`pointer: coarse\` 与宽度共同触发） |
| 行内小图标按钮 | 至少 24px，必要时通过 \`.hit\` 扩大命中区 |

相邻目标之间保持 ≥ 4px 间距，避免误触。

## 6. 无障碍底线

### 6.1 键盘

- 所有功能**全键盘可达**；不使用 \`div onClick\` 冒充按钮（列表框选项是 ARIA 模式的一部分，且有键盘等价）；
- Tab 顺序与视觉顺序一致；
- 模态层：焦点陷阱 + Esc 关闭 + 关闭后焦点还原；非模态浮层：Esc 关闭 + 焦点还给触发按钮；
- 仅悬停才出现的内容**不得**是唯一入口（提示在聚焦时同样出现，Esc 可关闭）。

### 6.2 焦点

- 全局 \`:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }\`；
- **不得** \`outline: none\` 而无替代；焦点环对比度 ≥ 3:1；
- 粘性栏不能遮挡聚焦元素：设置 \`scroll-padding-top / bottom\`。

### 6.3 对比度

| 内容 | 要求 | 设计稿取值（浅色） |
| --- | --- | --- |
| 正文 / 标签 | ≥ 4.5:1 | \`#1b1b1b\` on \`#ffffff\` ≈ 17:1 |
| 次要文字 | ≥ 4.5:1 | \`#5b5b5b\` on \`#ffffff\` ≈ 6.9:1 |
| 输入框边框、图标等非文字 UI | ≥ 3:1 | \`#8c8c8c\` on \`#ffffff\` ≈ 3.4:1 |
| 主按钮文字 | ≥ 4.5:1 | \`#ffffff\` on \`#0051c3\` ≈ 7.1:1 |

深色主题使用独立的令牌（见 05），而不是简单反色。

### 6.4 文字与行高

- 正文行高 ≥ 1.6（中英文）；标题 ≥ 1.3；
- 字号不低于 12px；输入框在窄屏为 16px；
- **不得**禁用缩放；支持 200% – 400% 缩放时回流到单列。

### 6.5 语义与地标

| 区域 | 元素 |
| --- | --- |
| 跳转 | 首个可聚焦元素为「Skip to main content」 |
| 导航 | \`<nav aria-label>\`；面包屑 \`<nav aria-label="Breadcrumb">\` + \`<ol>\` |
| 主内容 | \`<main id="main" tabindex="-1">\`，路由切换后聚焦 |
| 页头 | 每页一个 \`<h1>\`；分区 \`<h2>\`；对话框标题 \`<h2>\` |
| 表格 | 真实 \`<table>\`、\`<th>\`；排序列使用 \`aria-sort\`；容器 \`role="region"\` 且可聚焦 |
| 表单 | \`<label for>\`、\`<fieldset>/<legend>\`、\`aria-describedby\`、\`aria-invalid\` |
| 动态提示 | 常驻 \`aria-live="polite"\` 区域（Toast）；行内错误 \`role="alert"\` |
| 进度 | \`role="progressbar"\` + 文字说明 |

### 6.6 动效与主题

- 尊重 \`prefers-reduced-motion\`；
- 支持 \`prefers-color-scheme\`；主题提供「跟随系统（默认）/ 浅色 / 深色」，并在首屏前应用，避免闪烁；
- 状态不只靠颜色：警告 / 错误同时有图标与文字。

## 7. 性能与稳定性

| 项 | 做法 |
| --- | --- |
| 搜索输入 | \`useDeferredValue\` 延后过滤，输入保持流畅 |
| 事件监听 | 仅在需要时绑定（浮层打开时绑定外部点击 / Esc），卸载时清理 |
| 计时器 | 悬停进入 / 离开计时器在卸载时清除 |
| 宽度监听 | 使用 \`ResizeObserver\` / \`matchMedia\`，避免 \`scroll\` 中读取布局；窗口 \`resize\` 用 \`requestAnimationFrame\` 节流 |
| 目录高亮 | \`IntersectionObserver\` 代替滚动监听 |
| 动画属性 | 仅 \`width / opacity / transform / grid-template-rows\` |
| 宽度扫描 | 在 \`requestAnimationFrame\` 中推进，状态只在整数像素变化时更新 |

## 8. 测试方法

1. **手工**：设计稿宽度扫描 + 三个固定宽度；键盘走一遍；打开系统「减少动态效果」；
2. **缩放**：浏览器缩放到 200% / 400%，确认 320px 等效宽度回流；
3. **自动化**（可选）：使用 axe-core / Lighthouse 检查对比度、名称、地标；使用 Playwright 在 300 / 390 / 768 / 1440 截图并断言 \`document.documentElement.scrollWidth <= innerWidth\`；
4. **屏幕阅读器抽查**：NVDA / VoiceOver 走通「添加记录」流程，确认错误汇总与首错聚焦被播报。

## 9. 检查清单

- [ ] 300 / 390 / 768 / 1440 四个宽度下 \`scrollWidth ≤ innerWidth\`
- [ ] 无元素重叠、文字截断（除有意的省略号）
- [ ] 所有交互元素 ≥ 24px，触屏 / 窄屏 ≥ 44px
- [ ] 全键盘可完成主要流程，焦点环始终可见
- [ ] 正文对比度 ≥ 4.5:1，非文字 ≥ 3:1（两种主题）
- [ ] 200% 缩放不丢失功能
- [ ] 开启「减少动态效果」后无明显动画

## 1. 侧边栏

### 必须（MUST）

| 条目 | 原因 |
| --- | --- |
| 把占位槽宽度与视觉宽度解耦 | 否则悬停展开会推动内容，造成重排与抖动 |
| 折叠态的悬停展开必须同时响应键盘焦点 | 仅 hover 的功能会把键盘与读屏用户拒之门外 |

| 用户点击「收起」后抑制再次悬停展开直到指针离开 | 否则刚收起又弹出，像坏了 |
| 记住用户的固定状态（展开 / 折叠） | 偏好不应每次刷新都丢失 |
| 尊重 \`prefers-reduced-motion\` | 前庭障碍用户 |
| 窄屏使用模态抽屉并有焦点陷阱与 Esc 关闭 | 否则键盘焦点会漂到被遮挡的页面上 |
| 当前页使用 \`aria-current="page"\` | 读屏与样式的单一事实来源 |

### 应该（SHOULD）

| 条目 | 原因 |
| --- | --- |
| 悬停进入延迟 100 – 150ms，离开延迟 200 – 300ms | 过滤误触与抖动，同时保持「自动」的感觉 |
| 展开使用覆盖 + 阴影，而非推挤 | 避免内容区重排 |
| 标签延迟淡入、立即淡出 | 防止文字在宽度动画中被截断闪烁 |

| 分组默认仅展开包含当前页的一组 | 降低噪声 |
| 路由变化后把焦点移到主内容并回到顶部 | 防止「丢失位置」 |

### 可以（MAY）

- 在顶部提供「最近访问」分组；
- 在折叠态为图标提供额外的 Tooltip（若不使用悬停展开）；
- 提供命令面板，统一导航与动作。

### 避免（AVOID）

- 对 \`height: auto\`、\`left/top\` 做动画；
- 在折叠态里放置必须悬停才能看到的唯一入口；

| 允许粘贴；对粘贴内容做规范化 | 禁粘贴损害效率与可访问性 |
| 提交时汇总错误，并把焦点移到第一个错误字段 | 用户无需寻找问题所在 |
| 保留所有已填内容 | 清空表单是最不可原谅的错误 |
| 错误文案：哪里错 + 为什么 + 如何改 | 「Invalid input」没有信息量 |
| 错误通过 \`aria-invalid\` + \`aria-describedby\` 关联 | 读屏可读 |
| 保存时防止重复提交，并显示进度 | 避免重复创建 |
| 有未保存修改时拦截离开 | 防止数据丢失 |
| 危险操作二次确认，且默认焦点在非破坏性按钮 | 防止误触 |

### 应该

| 条目 | 原因 |
| --- | --- |
| 晚惩罚：失焦后才报错，之后实时更新 | 避免在用户输入中途打断 |
| 单列、分组、控制宽度（≤ 720px） | 扫描路径单一 |
| 字段 > 7 项时分组或分步 | 降低认知负担 |
| 条件字段仅在相关时出现 | 渐进披露 |
| 禁用状态必须说明原因 | 否则用户不知如何解除 |
| 保存条 / 操作栏使用粘性定位 | 长表单中保持可达 |
| 成功后返回上下文并高亮结果 | 让用户确认「确实成功」 |
| 窄屏输入框字号 16px，控件 44px | 避免 iOS 放大，保证触控 |
| 服务端错误映射回字段 | 与客户端错误一致的体验 |

### 可以

- 提供「保存并继续添加」；
- 在右侧提供上下文帮助侧栏（仅宽容器）；
- 对高风险操作要求输入名称确认；
- 提供实时预览（如 DNS 记录文本）。

### 避免

| 反模式 | 问题 |
| --- | --- |
| 用禁用提交按钮代替校验 | 用户不知道缺了什么 |
| 仅靠颜色表达错误 | 色觉障碍无法识别 |
| 一进入页面就满屏红字 | 噪声大、不友好 |
| \`alert()\` / \`confirm()\` 作为反馈 | 阻塞、无法样式化、不可访问性差 |
| 禁止粘贴或禁止缩放 | 违背无障碍与效率 |
| 提交成功却留在原页无反馈 | 用户不确定是否成功 |
| 清空整个表单来「重试」 | 丢失输入 |
| 把「取消」做成主按钮样式 | 误导主要路径 |

## 3. 响应式与布局

### 必须

- 页面级**无横向滚动**；宽内容（表格）在自身容器内滚动，容器可聚焦且有标签；
- 在 390 / 768 / 1440 三个宽度验证，并对 300px 做极端测试；
- Flex / Grid 的可收缩子项设置 \`min-width: 0\`；
- 间距仅使用 4 / 8 / 12 / 16 / 24 / 32 / 48。

### 应该

- 内容组件使用**容器查询 / ResizeObserver**，外壳使用媒体查询；
- 宽表格：关键列（勾选、操作）粘性固定，其余列容器内横向滚动并允许调列宽；容器足够窄时改用卡片；
- 页面最大宽度居中，避免宽屏下无限拉伸；
- 浮层打开时夹取到视口内；窄屏改为底部面板。

### 可以

- 提供「显示选项」让用户自选列与密度；
- 根据内容宽度（而非视口）显示辅助侧栏。

### 避免

- 仅用视口断点决定内容布局（侧边栏会改变内容宽度）；
- 固定像素宽度的卡片 / 对话框；
- 在窄屏中把桌面表格原样缩小；
- 用 \`overflow-x: hidden\` 掩盖溢出。

## 4. 视觉与组件

### 必须

- 先写令牌，再写样式；字号 ≤ 7 档、圆角 ≤ 4 档、阴影 ≤ 3 级；
- 一套图标库；图标按钮有可访问名称；
- 全部交互元素有可见的焦点环。

### 应该

- 主操作唯一，使用主色；次要操作用描边或幽灵按钮；
- 状态用语义色 + 图标 + 文字；
- 首屏只做一件事：一句话说明用户、任务与下一步。

### 避免

- 纯装饰渐变、满屏毛玻璃；
- 标题 emoji；
- 卡片套卡片；
- 同一页面多种主按钮；
- \`div onClick\` 假按钮、仅 hover 才可用的功能。

## 5. 无障碍

| 级别 | 条目 |
| --- | --- |
| 必须 | 全键盘可达；焦点可见；正文对比度 ≥ 4.5:1，非文字 ≥ 3:1；320px 可回流；中英行高 ≥ 1.6；目标 ≥ 24px（触屏 44px） |
| 应该 | 跳过链接；地标（nav / main）；路由切换后管理焦点；\`aria-live\` 通知；\`prefers-reduced-motion\` |
| 可以 | 提供键盘快捷键帮助面板；提供高对比度主题 |
| 避免 | \`outline: none\` 无替代；用颜色作为唯一信息载体；禁用缩放 |

## 6. 性能与质量

| 级别 | 条目 |
| --- | --- |
| 应该 | 输入过滤使用 \`useDeferredValue\`；监听器按需绑定并清理；用 \`ResizeObserver\` / \`IntersectionObserver\` 取代滚动监听；动画只用合成友好属性 |
| 应该 | 构建通过不代表质量合格：在 300 / 390 / 768 / 1440 手工或自动化巡检，并用宽度扫描做压力测试 |
| 避免 | 在 \`scroll\` / \`resize\` 回调中同步读取布局；在渲染期间创建大量内联对象导致子组件重复渲染 |

## 7. 交互式表格与条目

详细规则见 [08 · 交互式表格与条目规范](08-data-table-spec.md)。

### 必须

| 条目 | 原因 |
| --- | --- |
| 编辑 / 删除放在**最后一列**并粘性常驻 | 列很多、需要横向滚动时，关键操作仍然随时可点 |
| 粘性单元格有不透明背景，且与行的悬停 / 选中状态一致 | 否则内容透出、视觉断裂 |
| 列宽可调时必须有最小宽度、键盘可调、可恢复默认 | 防止列被拖没；键盘用户同样可用 |
| 排序用表头里的按钮，并设置 \`aria-sort\` | 可发现、可键盘操作、读屏可读 |
| 批量条不得插在表格上方 | 勾选后表格下移会让连选点错行 |
| 批量与删除可撤销，不适用项要说明 | 误操作成本低，结果可预期 |
| 有未保存的行内 / 弹窗编辑时拦截离开 | 防止数据丢失 |

### 应该

| 条目 | 原因 |
| --- | --- |
| 表头复选框 = 本页全选（半选态），并提供「选择全部匹配项」 | 与分页语义一致 |
| 支持 \`Shift + 点击\` 连选 | 大量行时的效率 |
| 提供行内展开与弹窗两种编辑形式，由用户选择并记住 | 不同任务的上下文需求不同 |
| 横向可滚动时，粘性列边缘出现阴影 | 提示「还有内容」 |
| 拖动列宽期间只改 DOM，松手再提交 state | 性能 |
| 编辑器以记录 id 为 key | 排序 / 翻页时不误复用状态 |

### 可以

- 在显示选项中允许隐藏次要列、切换密度；
- 在编辑器内提供「Open full form」进入整页表单。

### 避免

- Edit 放在中间列、需要滚到最右才能点到；
- 整行点击即编辑（与勾选、选中文本冲突）；
- 拖动列宽时每帧 \`setState\`；
- 卡片 / 表格两套布局同时渲染（会出现重复的编辑器与重复的 id）。

## 8. 评审速查表

| 问题 | 通过标准 |
| --- | --- |
| 这页的任务一句话能说清吗？ | 能；主操作 ≤ 3 个 |
| 折叠后能悬停展开并自动收起吗？ | 延迟合理，无抖动，键盘等价 |
| 没填完直接提交会怎样？ | 汇总 + 首错聚焦 + 内容保留 |
| 把窗口拖到 300px 会怎样？ | 无横向滚动，无重叠 |
| 只用键盘能完成吗？ | 能，焦点环可见 |
| 表格加到十几列，编辑入口还在吗？ | 在：末列粘性常驻，带滚动阴影 |
| 折叠后的图标栏里能看到文字吗？ | 不能；图标在带内居中 |
| 深色主题下对比度够吗？ | 够，使用独立令牌 |

| 列宽可调 | 表头右缘分隔条：拖动 / 键盘 / 双击恢复；有最小宽度；持久化 | 任意列表头右缘 |
| 排序 | 表头放排序按钮；升序 → 降序 → 无 三态；\`aria-sort\` | Name / Type / Content / Proxy / TTL / Comment / Modified |
| 勾选与全选 | 首列复选框；表头复选框 = 本页全选（半选态）；Shift 连选；可「选择全部匹配项」 | 首列 |
| 批量操作 | 悬浮粘性批量条；可撤销；对不适用项给出说明 | 页面底部 |
| 行内操作 | **最后一列常驻**（粘性固定）：Edit + Delete | 末列 Actions |
| 编辑形式 | 展开编辑区（默认）或弹窗，由用户在显示选项中选择 | Display options → Edit style |
| 列显隐 / 密度 | 次要列可隐藏；紧凑 / 舒适密度 | Display options |
| 分页 | 每页 5/10/25/50；跨页选择；返回列表时翻到高亮行所在页 | 表格下方 |
| 窄容器 | 容器 < 700px 切换为卡片列表（同一数据，触控友好） | 拖窄宽度 |

## 2. 表格结构

\`\`\`text
┌ .tbl（overflow-x:auto，可聚焦 region）─────────────────────────────────────┐
│ [☐ sticky-left] [!] Name ⇅│ Type ⇅│ Content ⇅│ Proxy ⇅│ … │ 填充列 │ [Actions sticky-right] │
│ [☐]            [!] …                                             │ [Edit][🗑]            │
│ ┌ edit-row（colSpan 全部，内容 sticky-left，宽度 = 容器可视宽度）─────────────┐ │
│ │ 行内编辑器：Type / Name / TTL / Content / Proxy / Comment · Save / Cancel │ │
│ └──────────────────────────────────────────────────────────────────────┘ │
└──────────────────────────────────────────────────────────────────────────┘
        分页 / 计数                                       [悬浮批量条 sticky bottom]
\`\`\`

- 使用真实的 \`<table>\`；\`table-layout: fixed\` + \`<colgroup>\` 控制列宽；
- \`border-collapse: separate; border-spacing: 0\`：粘性列的边框才不会随内容滚走；
- 表格 \`width:100%\`，\`min-width\` = 可见列宽之和 + 固定列宽；容器更宽时由一列**填充列**（\`<col />\` 无宽度）吸收剩余空间，因此用户设置的列宽永远是精确值。

## 3. 列宽调节

### 3.1 必须

| 条目 | 原因 |
| --- | --- |
| 每个数据列都有最小宽度（如 64 / 120px），拖动不能小于它 | 防止列被拖没，内容不可辨 |
| 键盘可调：分隔条可聚焦（\`role="separator"\`、\`aria-valuenow/min/max\`），\`←/→\` ±8px，\`Shift\` ±32px，\`Home/End\`，\`Enter\` 恢复默认 | 全键盘可达 |
| 提供恢复入口：双击分隔条 / \`Enter\` / 显示选项里的「Reset column widths」 | 用户可以随时回到默认 |
| 宽度被持久化（\`localStorage\`） | 偏好不应每次刷新丢失；存储失败时静默降级 |
| 拖动不应触发排序（分隔条的点击要 \`stopPropagation\`） | 避免误操作 |

### 3.2 应该

- 分隔条常驻一条淡色竖线作为**可发现性提示**；悬停 / 聚焦 / 拖动时加粗并使用主色；
- 命中区 12px（粗指针 20px），位于表头单元格右缘**内侧**，避免被相邻列覆盖；
- 拖动过程**只改写 DOM**（\`<col>\` 与 \`<table>\` 的 style），松手时一次性提交到 React state——拖动期间零重渲染；
- 表头文字过长时使用省略号，不换行、不撑破列。

### 3.3 避免

- 用 \`width: 100%\` 的表格 + 无填充列：容器变宽时所有列被按比例拉伸，用户设置的宽度失真；
- 拖动中每个 \`pointermove\` 都 \`setState\`：行数多时会掉帧；
- 把分隔条画在单元格之外（右侧列会盖住它，拿不到事件）。

## 4. 排序

- 表头放一个**按钮**（不是整格可点），文字 + 方向图标；三态循环：升序 → 降序 → 无；
- 当前排序列的 \`<th>\` 设置 \`aria-sort\`；图标在激活时使用强调色；
- 数值列（TTL）、时间列（Modified）按数值排序，其余按字符串（\`localeCompare\`）；
- 排序发生在筛选之后、分页之前；排序后保持当前页码（筛选 / 搜索变化才回到第 1 页）。

## 5. 勾选、全选与批量操作

### 5.1 勾选规则

| 控件 | 行为 |
| --- | --- |
| 行复选框 | 单击切换；\`Shift + 点击\` 选择连续区间（以上次点击的行为起点） |
| 表头复选框 | 作用于**本页**所有行；部分选中时显示半选（\`indeterminate\`） |
| 「Select all N matching records」 | 本页全选后，若还有更多页，在批量条中出现，选中所有匹配筛选的行 |
| 选中高亮 | 整行主色浅底；\`aria-selected\` |

- 选择集合与分页解耦：翻页不丢选择；筛选后批量操作只作用于「被选中且当前可见（匹配）」的行；
- 复选框命中区 ≥ 32px（\`.hit\`），列宽 44px。

### 5.2 批量条

- **悬浮 + \`position: sticky; bottom: 16px\`**，贴在视口底部；**不得**插在表格上方——否则勾选第一行后整张表下移，\`Shift\` 连选会点错行；
- 内容：已选数量（\`aria-live\`）· 可选的「选择全部」· 动作按钮 · 清除选择；
- 动作按顺序为：不危险的修改 → 导出 → 危险操作（Delete，危险色）；
- **可撤销优先于二次确认**：删除除了确认对话框外，还提供 8 秒的「Undo」通知；批量修改（代理状态）直接执行并给出「Undo」；
- 对不适用的项给出说明，而不是静默忽略：「2 records set to Proxied · 3 skipped (not proxyable)」。

## 6. 行内操作：最后一列常驻

### 6.1 必须

| 条目 | 原因 |
| --- | --- |
| 编辑 / 删除放在**最后一列**，用 \`position: sticky; right: 0\` 固定 | 列很多时用户需要横向滚动，但随时都要能点到 Edit |
| 首列（勾选）同样粘性固定 | 横向滚动时仍可对行勾选 |
| 粘性单元格必须有不透明背景（\`background: inherit\`，行本身有实色背景） | 否则下面滚过的内容会透出 |
| 悬停 / 选中 / 展开时，粘性单元格背景与整行一致 | 视觉上是一整行 |
| 横向可滚动时，粘性列边缘出现阴影提示（\`data-more-left/right\`） | 告诉用户「还有内容」 |

### 6.2 应该

- 末列只放 1 个文字按钮（Edit）+ 1 个图标按钮（Delete），宽 144px；Edit 带文字，因为它是主要行内动作；
- 末列有可见的列头「Actions」，读屏可读；
- 滚动提示通过 \`scroll\` + \`ResizeObserver\` + \`rAF\` 合并更新，**直接写 DOM 属性**，滚动时不触发 React 渲染。

## 7. 编辑形式：展开编辑区 vs 弹窗

两种形式共用同一个 \`RecordEditor\`，校验规则一致；由用户在「Display options → Edit style」选择，偏好被记住。

| 维度 | 展开编辑区（行内） | 弹窗 |
| --- | --- | --- |
| 上下文 | 保留在表格里，可对照周围行 | 暂时离开表格，专注编辑 |
| 并行编辑 | 可同时展开多行（各自独立保存 / 取消） | 一次一个 |
| 适合 | 字段少（≤ 7）、频繁微调 | 字段多、需要更多说明或更严肃的确认 |
| 无障碍 | Edit 按钮 \`aria-expanded\` + \`aria-controls\`；打开后焦点进入第一个字段 | 原生 \`<dialog>\`：焦点陷阱、Esc、背景 inert；\`aria-haspopup="dialog"\` |
| 关闭后 | 焦点回到该行的 Edit 按钮 | 同左 |

### 7.1 展开编辑区的实现要点

- 编辑行是紧跟数据行的 \`<tr>\`，单个 \`<td colSpan=全部列>\`；
- 因为表格可能比容器宽，编辑区内部使用 \`position: sticky; left: 0; width: var(--sw)\`，\`--sw\` 为滚动容器可视宽度（由 \`useScrollAffordance\` 维护）——横向滚动时编辑区始终停在可视范围内；
- 编辑区内字段使用 \`grid-template-columns: repeat(auto-fit, minmax(min(260px,100%), 1fr))\`，从 300px 到 1100px 都自适应；
- 窄容器（卡片模式）下，编辑区展开在卡片内部。

### 7.2 编辑器的行为规范

- 校验同整页表单（失焦即时校验 → 提交整体校验 → 首个错误聚焦 → 保留输入）；紧凑场景不显示顶部汇总，只保留行内错误；
- 服务端冲突（如 CNAME 与其他记录同名）映射回对应字段；
- 保存中显示进度并防止重复提交；成功后收起编辑区、通知、高亮该行；
- 提供「Open full form」链接，进入整页表单做复杂编辑。

### 7.3 未保存保护

- 编辑器通过回调向页面上报 \`dirty\`；页面维护一个脏集合；
- 有脏数据时：Cancel / 再次点击 Edit / 关闭弹窗 → 弹出「Discard unsaved changes?」（默认焦点在「Keep editing」）；
- 站内导航（侧边栏、面包屑、链接）同样被拦截；刷新 / 关闭标签页使用 \`beforeunload\`；
- 记录被删除时，编辑器卸载并清除其脏标记，**不得**留下「幽灵脏数据」把导航永远拦住。

## 8. 响应式

| 容器宽度 | 表现 |
| --- | --- |
| ≥ 700px | 表格；内容超宽时在 \`.tbl\` 内横向滚动，首末列粘性固定 |
| < 700px | 卡片列表：名称 / 类型 / 内容 / 代理 / TTL + 底部 Edit / Delete；勾选与展开编辑仍可用 |

- 切换由 \`ResizeObserver\` 驱动，只在**跨越阈值**时更新 state（宽度扫描 / 拖动窗口时零额外渲染）；
- 表格与卡片**只渲染一种**，避免同一条记录同时存在两个编辑器；
- 工具栏、分页区使用 \`flex-wrap\`，在 300px 下自动换行。

## 9. 分页

- 底部左侧显示「Showing 1–10 of 14」（筛选时附带「filtered from N」，\`aria-live\`）；右侧「Rows per page」+ 上一页 / 下一页；
- 搜索 / 筛选 / 每页数量变化 → 回到第 1 页；
- 从表单页保存返回并带 \`?highlight=<id>\`：自动翻到该行所在页，滚动到视口中央并闪烁高亮；
- 上一页 / 下一页在边界处禁用是可以接受的（这不是表单提交，用户不会因此困惑）。

## 10. 无障碍

- 表格有 \`<caption>\`（读屏可读，说明如何调整列宽）；\`<th scope="col">\`；排序列 \`aria-sort\`；
- 横向滚动容器：\`tabindex="0"\` + \`role="region"\` + 名称，键盘用户可用方向键滚动；
- 每个行内按钮都带对象名称：\`aria-label="Edit A record www.myexample.com"\`（可见文字 Edit 包含在名称开头，满足「标签包含在名称中」）；
- 分隔条：\`role="separator"\`、\`aria-orientation="vertical"\`、\`aria-valuenow/min/max\`、可聚焦；
- 勾选、批量条数量、分页计数使用 \`aria-live="polite"\`；
- 状态不只靠颜色（待处理记录使用警告图标 + 文字替代）。

## 11. 性能

| 点 | 做法 |
| --- | --- |
| 搜索输入 | \`useDeferredValue\` 延后过滤 |
| 列宽拖动 | 只改 DOM，松手才 \`setState\` |
| 横向滚动提示 | \`scroll\`（passive）+ \`rAF\` 合并，写 \`dataset\`，不进 React |
| 断点切换 | \`ResizeObserver\` + 仅布尔值变化才 \`setState\` |
| 行渲染 | 分页限制每次渲染的行数；\`key\` 使用稳定的记录 id（编辑器状态在排序 / 翻页时不被误复用） |
| 选择集合 | \`Set\`；连选在事件处理函数里计算，**不在 setState 更新函数里改 ref**（StrictMode 会二次调用更新函数） |

## 12. 避免（AVOID）

| 反模式 | 问题 |
| --- | --- |
| 把 Edit 放在可横向滚走的中间列 | 列一多就要先滚到最右才能编辑 |
| 粘性列没有背景 | 内容从下面透出，文字重叠 |
| 勾选后在表格上方插入批量条 | 表格整体下移，连选错位 |
| 整行点击即编辑 | 与勾选、选中文本冲突 |
| 拖动列宽时同步重渲染整张表 | 掉帧 |
| 列宽不设最小值 | 列被拖没 |
| 弹窗里再弹一个确认窗且焦点丢失 | 键盘用户迷路（本方案用原生 dialog 栈，关闭后焦点还原） |
| 排序 / 翻页后丢失正在编辑的内容 | 编辑器以记录 id 为 key，且有未保存保护 |

## 13. 检查清单（验收）

- [ ] 拖动任意数据列右缘可改变宽度；不能小于最小宽度；刷新后保持；双击恢复
- [ ] Tab 聚焦分隔条后，\`←/→\`、\`Shift+←/→\`、\`Home/End\`、\`Enter\` 可用
- [ ] 显示更多列让表格变宽后，横向滚动时最右侧 Edit / Delete 始终可见，首列勾选始终可见
- [ ] 粘性列边缘有滚动阴影；悬停 / 选中时粘性单元格背景与整行一致
- [ ] 表头排序三态；\`aria-sort\` 正确
- [ ] 表头复选框本页全选 / 半选；Shift 连选；「Select all N matching」可用
- [ ] 勾选后底部出现悬浮批量条，表格行没有位移
- [ ] 批量修改与删除均可撤销；不适用项有说明
- [ ] Edit：行内展开与弹窗两种形式均可用，切换后偏好被记住
- [ ] 编辑器：空 Name 提交 → 首错聚焦；CNAME 冲突 → 映射到 Name
- [ ] 有未保存编辑时，Cancel / 导航 / 刷新都有保护；删除正在编辑的记录后不会再拦截导航
- [ ] 容器 < 700px 为卡片列表且功能不缺失；300px 下无横向溢出（表格容器内滚动除外）

## 14. 在设计稿中验证

1. 打开「设计稿」→ 场景「DNS 记录」；
2. 拖动 Content 列右缘；再用 Tab 聚焦分隔条，按 \`←/→\`；
3. 打开 Display options，勾选 Modified、Comment，再把预览宽度拖到 900px：观察横向滚动与粘性的 Edit 列；
4. 点击 Edit：先清空 Name 保存；再改为 \`www\`、类型 CNAME 保存；
5. Display options → Edit style 切换为「Open in dialog」，重复一次；
6. 勾选一行，按住 Shift 点另一行；点击底部 Proxied / Delete，再用通知中的 Undo；
