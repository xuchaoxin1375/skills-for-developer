> 本文档集描述一套面向"管理控制台 / 后台面板"类产品的设计与交互规范。规范以 Cloudflare Dashboard 的成熟实践为参照，抽象为可直接落地的规则，并附带一个可运行的模拟设计稿（本仓库的 Web 程序）作为综合案例。

## 1. 适用范围

- 面向运维、开发者、管理员的 B 端 Web 控制台（域名/DNS、安全、网络、计费等）。
- 桌面优先，但要求在 320px～2560px 全宽度范围内可用；极端窄窗（300px）要求"可回流、不溢出"。
- 浅色 / 深色 / 跟随系统三种外观。

## 2. 规范用语

| 用语 | 含义 |
| --- | --- |
| **必须 (MUST)** | 不满足即视为缺陷，评审不通过。 |
| **应该 (SHOULD)** | 默认遵循；偏离需在设计评审中说明理由。 |
| **可以 (MAY)** | 可选做法，视场景采用。 |
| **避免 (AVOID / NEVER)** | 明确禁止或强烈不建议的做法。 |

| --- | --- | --- | --- |

| 02 | [设计令牌与视觉](#/guide/tokens) | 颜色、字体、间距、圆角、阴影、图标、主题切换 | 全站 |
| 03 | [应用外壳与侧边栏](#/guide/shell) | 顶栏、侧边栏状态机（固定/折叠/悬停展开/抽屉）、命令面板 | 全站侧边栏 |
| 04 | [表单](#/guide/forms) | 字段结构、布局栅格、两级校验、首错聚焦、长表单与向导 | DNS 内联表单、Create、Wizard、Settings |
| 05 | [表格与列表](#/guide/tables) | 工具栏、筛选浮层、显示选项、排序、**列宽调节**、批量操作、**常驻操作列**、展开行/弹窗编辑、空态、窄屏退化 | DNS records |

## 4. 设计思路概述

1. **一个页面做一件事。** 页面标题下的首屏只呈现主任务（如"DNS 记录表格"），次要信息折叠（如"Recommendations"可收起）。
2. **壳层稳定，内容流动。** 顶栏 + 侧边栏构成稳定的壳层；侧边栏在桌面端可固定/折叠，折叠时悬停临时展开（覆盖而非推挤内容），内容区不因导航状态变化而重排。
3. **令牌先行。** 所有组件只消费语义令牌（\`--c-surface\`、\`--c-text-2\`…），主题切换只替换令牌值。
4. **表单先线框后样式。** 字段分组（≤7 项一组）、单列优先、宽屏才并列；校验分"失焦即时 + 提交汇总"两级；提交失败保留已填内容并聚焦首个错误。
5. **破坏性操作远离首屏 + 二次确认。** 删除放在编辑态的最左侧或页面最底部的"危险区"，并经模态确认（高风险要求输入名称确认）。
6. **无障碍是底线而非加分项。** 全键盘可达、可见焦点、≥24px 命中目标、4.5:1 对比度、尊重 \`prefers-reduced-motion\`。

## 5. 如何阅读本模拟稿

- 左侧侧边栏 **Design Guide** 分组列出全部文档；**Responsive Lab** 可在任意宽度下预览所有页面并自动扫描宽度。
- 顶栏右侧可切换 浅色 / 深色 / 跟随系统。
- 快捷键：\`Ctrl/⌘ + K\` 打开快速搜索；\`[\` 切换侧边栏固定/折叠；\`Esc\` 关闭任何浮层。

## 6. 验收清单（摘要）

- [ ] 390 / 768 / 1440 三档宽度无横向滚动、无元素挤压溢出；320px 可回流。
- [ ] 侧边栏四态（固定 / 折叠 / 悬停展开 / 移动抽屉）切换平滑，键盘可操作。
- [ ] 每个表单：可见标签、失焦校验 + 提交汇总、首错聚焦、保留已填内容、允许粘贴。
- [ ] 所有危险操作有二次确认；删除后提供撤销或明确不可恢复提示。
- [ ] 浅色 / 深色对比度均 ≥ 4.5:1；Tab 顺序合理；焦点环可见。
- [ ] 无 \`alert()\`、无 \`div onClick\` 假按钮、无仅 hover 可达的功能。
`,Kz=`# 01 · 设计原则

本篇定义控制台产品的顶层设计原则。后续各篇（壳层、表单、表格、响应式、无障碍）均是这些原则在具体场景的展开。

## 1. 任务清晰

### 必须

- 每个页面有且只有一个 \`h1\`，用一句话说清"对象 + 动作"，例如 \`DNS records for myexample.com\`。
- 标题下方一句描述（≤ 2 行）回答"这个页面能做什么"。
- 首屏只做一件事：主操作按钮 **≤ 3 个**，其中 **仅 1 个** 使用 primary 样式（如 \`Add record\`）。
- 危险操作（删除、暂停、移除站点）**不得**出现在首屏主操作区；必须放在编辑态内部、行菜单或页面底部的"Advanced actions / 危险区"中，并经二次确认。

### 应该

- 页面级的"状态/提示"（如域名 Pending）使用 \`Alert\` 横幅置于标题之下、内容之上，可关闭。
- 次要信息（推荐、统计）使用可折叠卡片，默认状态由信息价值决定（"All set"时默认收起）。
- 操作结果通过非阻塞 \`toast\` 反馈，且删除类操作提供 **Undo**。

### 可以

- 对首次访问者提供"Setup checklist"等引导卡片。
- 使用"Recents"记录最近访问的页面，缩短跨区域往返路径。

### 避免

- 一个页面同时承载两个主任务（例如既是列表又是复杂设置）。
- 使用 \`alert()\` / \`confirm()\` 原生弹窗。
- 用禁用提交按钮替代校验反馈（用户不知道为什么不能提交）。

## 2. 布局克制

### 必须

- 页面类型四选一：**仪表盘**（Overview）、**列表 + 详情/内联编辑**（DNS records）、**单列表单**（Create / Wizard）、**设置页**（Settings）。不混用。
- 间距只使用 \`4 / 8 / 12 / 16 / 24 / 32 / 48\` px。
- 内容区最大宽度 1440px 居中，左右内边距：移动 16px，平板 24px，桌面 32px。
- 先确认线框（信息层级、折行策略）再写样式。

### 应该

- 卡片（Card）是唯一的内容容器；卡片内部不得再嵌套卡片（用分割线或分组标题替代）。
- 卡片结构固定：\`CardHeader(title, description, actions)\` → \`CardBody\` → \`CardFooter(note, actions)\`。
- 工具栏遵循"搜索框居左伸缩，操作按钮居右，primary 在最右"。

### 避免

- 卡片套卡片、满屏毛玻璃、纯装饰性渐变、标题 emoji。
- 为了"看起来丰富"添加无数据支撑的图表占位。

## 3. 信息层级

| 层级 | 字号 / 行高 | 用途 |
| --- | --- | --- |
| 2xl | 28 / 36 · 600 | 页面标题 |
| xl | 20 / 28 · 600 | 统计数值、对话框标题 |
| lg | 16 / 24 · 600 | 卡片标题 |
| base | 14 / 22 | 正文、表格、输入框 |
| sm | 13 / 20 | 辅助说明、标签 |
| xs | 12 / 18 | 提示、错误、脚注 |
| 2xs | 11 / 16 | 徽标、快捷键 |

- 字号阶梯 **≤ 7 档**；中英混排行高 ≥ 1.6（本规范正文 14/22 ≈ 1.57，段落用 1.6）。

## 4. 反馈模型

| 场景 | 组件 | 位置 | 是否阻塞 |
| --- | --- | --- | --- |
| 字段错误 | 字段下方红字 + 图标 | 字段内 | 否 |
| 表单提交失败汇总 | \`Alert(danger)\` | 表单顶部 | 否 |
| 操作成功 / 信息 | \`toast\` | 右下角（移动端底部全宽） | 否，5s 自动消失 |
| 操作失败 | \`toast(error)\`，\`role=alert\` | 同上 | 否，8s |
| 破坏性确认 | \`Dialog(tone=danger)\` | 居中（移动端底部抽屉） | 是 |
| 页面级状态 | \`Alert(warning/info)\` | 标题下 | 否 |
| 长任务 | 按钮 \`loading\` + \`aria-busy\` | 就地 | 局部 |

本篇覆盖四种表单形态：**内联表单**（表格行内新增/编辑，如 DNS 记录）、**长表单**（Create application）、**向导**（Add a domain）、**设置卡片**（Settings）。

## 1. 字段结构

每个字段统一由 \`Field\` 包装：

\`\`\`
┌ label (必填 * / optional) ──────────── labelAside (计数器等) ┐
│ control (input / select / textarea / toggle / radio-cards)   │
│ hint（灰）  或  error（红 + 图标, role=alert）                │
└──────────────────────────────────────────────────────────────┘
\`\`\`

### 必须

- 标签可见且 \`<label for>\` 关联；**不得**用 placeholder 代替标签。
- 错误文本通过 \`aria-describedby\` 关联到控件，并设置 \`aria-invalid="true"\`。
- 必填用 \`*\` 标记，并以 \`required\` 语义或说明文字补充；可选字段标注 \`(optional)\`。
- 控件高度 36px（触屏命中区 ≥ 44px 时使用 \`size="lg"\`）。
- 允许粘贴、允许浏览器缩放、允许自动填充（除非安全原因并说明）。

### 应该

- 提示文字（hint）说明格式与示例：\`Use @ for root\`、\`e.g. 192.0.2.1\`。
- 带长度限制的字段显示 \`n/limit\` 计数器，超限变红。
- 技术输入（IP、域名）使用等宽字体并关闭拼写检查。
- 字段的"派生信息"实时显示（如输入 \`www\` 时提示 \`Resolves as www.myexample.com\`）。

### 避免

- 占位符颜色过浅（对比度 < 4.5:1）。
- 禁用粘贴、\`inputmode\` 错配（数字字段应 \`inputMode="numeric"\`）。

## 2. 布局栅格

| 宽度 | 列数 | 规则 |
| --- | --- | --- |
| < 640 | 1 | 全部单列；按钮组纵向堆叠，primary 在最上（\`flex-col-reverse\`） |
| 640–1023 | 6 | 短字段（Type、TTL、Priority）占 2–3 列，长字段占 6 |
| ≥ 1024 | 12 | 内联表单：Type 2 · Name 4 · Content 6 · Proxy 4 · TTL 2 · Comment 12 |

### 必须

- 表单 **单列为默认**；只有在 ≥ 640px 且字段短、语义相关时才并列。
- 字段 ≥ 7 项必须分组（卡片 + 标题），长表单 ≥ 3 组时提供右侧粘性大纲（≥ 1024px）。
- 操作区：\`Cancel\` 在 \`Save\` 左侧；破坏性按钮（Delete）在最左侧并与保存区分开。
- 页面级无横向滚动；所有字段容器 \`min-width: 0\`。

## 3. 两级校验

| 级别 | 触发 | 表现 |
| --- | --- | --- |
| 字段级 | 控件 \`blur\`（首次触碰后实时） | 字段下方错误文本 |
| 表单级 | 点击提交 | 顶部 \`Alert(danger)\` 汇总 + 所有字段显示错误 + **聚焦首个错误** |

### 必须

- 提交失败 **保留所有已填内容**。
- 首个错误控件 \`focus()\` 并 \`scrollIntoView({block:"center"})\`。
- 表单使用 \`noValidate\`，由应用控制错误文案的一致性。
- 不以"禁用提交按钮"替代校验（允许点击并解释为什么失败）。向导的"Continue"同理。
- 跨字段 / 跨记录规则在提交前校验（示例：\`CNAME\` 不能与同名其他记录共存；重复记录）。

### 应该

- 校验函数纯函数化（\`validateRecord(values, existing)\`），同一函数服务于字段级和表单级。
- 错误文案 = "是什么错 + 怎么改"：\`Enter a valid IPv4 address, e.g. 192.0.2.1.\`
- 汇总 Alert 中的每条错误可点击跳转到对应字段。

### 可以

- 保存时按钮 \`loading\` + \`aria-busy\`，禁止重复提交。
- 存在未保存修改时监听 \`beforeunload\`。

## 4. 内联表单（表格行内）

- "Add record"：在表格上方插入高亮卡片（主色边框），聚焦第一个控件；表格保持可见，便于参照现有记录。
- "Edit"：该行被替换为表单（\`colSpan\` 全宽，浅蓝底）；同一时刻只允许一个编辑态。
- 保存成功：关闭表单、toast 反馈、焦点回到触发按钮（新增）或保持在表格。
- 删除按钮只出现在编辑态内，且弹出确认。

## 5. 长表单（Create）

- 分组卡片 \`id\` 即锚点，\`scroll-margin-top\` 预留顶栏高度。
- 右侧粘性大纲（\`position: sticky; top: topbar + 24px\`）：IntersectionObserver 滚动监听高亮当前节；每节显示错误数角标。
- < 1024px 时大纲隐藏，改用 **底部粘性操作条**，仅在表单 dirty 时滑入。
- 单选"卡片"（RadioCards）用于互斥且需要解释的选项（环境、源类型），≤ 4 项；更多用 \`select\`。
- 标签输入（Tags）：Enter / 逗号添加，Backspace 删除末项，上限明确。

## 6. 向导（Wizard）

- 适用：步骤间存在依赖、每步决策需要解释、总字段数多且顺序固定。
- 顶部线性进度（已完成 ✓ / 当前 / 待办），已完成步骤可点击回退。
- Back 永不丢数据；最后一步是只读 Review。
- 切换步骤后将焦点移到步骤标题（\`tabindex=-1\`），屏幕阅读器可感知。

## 7. 设置卡片（Settings）

- 一卡一决策：\`CardHeader\` 说明 → 控件 → \`CardFooter\`（左侧状态文字，右侧 Save）。
- 即时生效的开关（Toggle）不需要 Save，但 **必须** 通过 toast 反馈。
- 有 Save 的卡片只有 dirty 时才启用 Save；提示文字由 \`Saved\` 变为 \`You have unsaved changes.\`
- 危险区置于页面最底部，红色描边，每项"说明 + 后果 + 次级红色按钮"。

## 8. 确认对话框

- \`Dialog(tone="danger")\`：标题为问句，描述说明后果，主按钮为动词。
- 移动端从底部滑入（\`rounded-t-lg\`），桌面居中。
- 焦点陷阱、\`Esc\` 关闭、关闭后焦点还原到触发元素。
- 高风险：要求输入资源名称，匹配前主按钮禁用（这是允许禁用按钮的例外场景——用户已被明确告知要输入什么）。

## 9. 速查表

| 项目 | 规则 |
| --- | --- |
| 输入框高度 | 36px；触屏 44px |
| 标签-控件间距 | 6px |
| 字段间距 | 16px |
| 错误颜色 | \`--c-danger\`，附图标，不单靠颜色 |
| 按钮顺序 | [Delete] …… [Cancel] [Primary] |
| 窄屏按钮 | 纵向堆叠，primary 在上 |
| 提交后焦点 | 首个错误控件 / 触发按钮 |

参考页面：**DNS records**。该页面集中了控制台列表页的全部标准构件：页面标题、状态横幅、可折叠推荐、工具栏、筛选浮层、显示选项、排序表格、内联编辑、批量操作、空态与分页信息。

## 1. 页面骨架（自上而下）

1. \`PageHeader\`：标题、描述、右侧 meta Badge（\`DNS Setup: Full\`）与文档按钮。
2. \`Alert(warning)\`：域名 Pending 等页面级状态，可关闭。
3. \`CollapsibleCard\`：Recommendations，"All set"时默认收起。
4. **工具栏**：搜索框（左、伸缩、最大 520px）| Filters | Display options | Import | Export | **Add record**（primary，最右）。
5. 激活筛选 chips（可逐个移除）。
6. （条件）新增表单卡片。
7. 表格卡片：配额说明条 → 表格 → "Showing a–b of n"。
8. （条件）浮动批量操作条。

## 2. 工具栏

### 必须

- 搜索框带可见清除按钮；输入 **防抖 ≥ 150ms** 后再过滤，避免逐键重算。
- 所有按钮带图标 + 文字；primary 只有一个。
- < 1024px 时搜索框独占一行，按钮组换行并允许折行（\`flex-wrap\`），不得横向溢出。

### 应该

- 搜索支持从 URL 参数预填（\`?q=\`），便于分享与从命令面板跳转。
- Export 立即下载（Blob + \`<a download>\`），Import 使用 Dialog 粘贴文本并说明格式。

## 3. 筛选浮层（Filters Popover）

结构：标题 + 关闭 → 多行条件（字段 ▾ · 运算符 ▾ · 值 · 删除）→ 底部（+ Add filter | "Press Enter to apply" · Clear · **Apply**）。

### 必须

- **草稿与已应用分离**：浮层内的修改是草稿，\`Apply\`/Enter 才生效；关闭浮层不丢草稿。
- Apply 在没有任何有效值时禁用，并有文字提示（这是"禁用按钮"的允许例外：无输入即无意义）。
- 条件行在 < 640px 时重排为两行（字段+删除 / 运算符+值），保持可操作。
- 浮层 \`role=dialog\`，打开后焦点进入首个控件，\`Esc\` 关闭并把焦点还给触发按钮；点击外部关闭。
- 浮层宽度 \`min(560px, 100vw − 16px)\`，位置随滚动/缩放重新计算，永不越出视口。

### 应该

- 触发按钮上显示激活筛选数量徽标；页面上显示 chips，支持单独移除。

## 4. 显示选项（Display options）

- 列可见性复选框（Proxy / TTL / Comment / Details）与密度开关（Comfortable / Compact）。
- 持久化到 \`localStorage\`，刷新后保留。

## 5. 表格

### 必须

- 语义化：\`<table>\` + \`<caption class="sr-only">\` + \`<th scope="col">\`；排序按钮带 \`aria-sort\`。
- 表格置于卡片内 \`overflow-x: auto\`；设置 \`min-width\`（示例 760px）保证列不被压扁；**页面级不出现横向滚动**。
- 可能很长的单元格（Name、Content、Comment）设置 \`max-width\` + \`truncate\` + \`title\` 悬停显示全文。
- 行选择复选框使用 24px 命中区包裹 16px 视觉框；表头支持全选 / 半选（\`indeterminate\`）。
- 行操作 \`Edit\` 固定在最右列，并带 \`aria-label="Edit A www.example.com"\`。

### 应该

- 名称列区分子域与主域颜色（\`www.\` 深色 + \`myexample.com\` 浅色）。
- 技术内容列用等宽字体。
- 排序三态循环：升 → 降 → 无。
- 悬停行底色 \`surface-2\`；选中行 \`primary-soft\`。
- 警告图标列固定在最左侧，Tooltip 解释原因。

### 可以

- 行密度切换（Compact 行高 32px）。

## 5.1 列宽调节

### 必须

- 数据列可拖拽调节宽度：表头右缘 8px 热区（视觉 1px 分隔线，悬停/拖动变为 3px 主色），\`cursor: col-resize\`。
- 使用 \`table-layout: fixed\` + \`<colgroup>\` 设置宽度，拖动时**只重排本表**，不影响页面其它部分。
- 每列有 \`min / max\` 边界（示例：Name 140–520，Content 160–720），防止拖成 0 或无限宽。
- 固定功能列（复选框、警告、操作）不可调节，也不显示把手。
- 把手可键盘操作：\`role="separator" aria-orientation="vertical" aria-valuenow\`，\`← →\` 16px、\`Shift\` 64px、\`Home\` 还原；双击还原单列；Display options 中提供"Reset column widths"。
- 宽度持久化（\`localStorage\`）**只在拖动结束时写入**，拖动过程中仅更新内存状态。

### 应该

- 拖动期间给 \`body\` 设置 \`user-select: none\` 与统一的 \`cursor\`，避免选中文字和光标闪烁。
- 使用 Pointer Events + \`setPointerCapture\`，鼠标移出表格也能继续拖动。

## 5.2 常驻操作列（Sticky actions）

> 列很多时，用户最常用的 Edit 不能被"滚到右边才看得到"。

### 必须

- 最后一列（Edit / 行菜单）\`position: sticky; right: 0\`，始终可见。
- 粘性单元格背景必须**不透明**，且与行的悬停/选中态一致：行使用实色背景（\`bg-surface\` / \`hover:bg-surface-2\` / 选中 \`bg-primary-soft\`，**不用透明度**），单元格 \`background: inherit\`。
- 只有在内容实际可横向滚动且未滚到最右时，才显示左侧分隔线与内阴影（提示"右侧被遮住的部分在这里"）。实现：监听容器 \`scroll\` + \`ResizeObserver\`，\`scrollWidth − clientWidth − scrollLeft > 1\`。
- 表头同列同样 sticky，并与数据行 z-index 配合（表头 2，单元格 1）。

### 可以

- 需要时同样固定首列（复选框 + 名称），但同时固定两侧时要确保窄屏（≥640px 表格模式）中间仍有 ≥ 240px 可读区域。

## 6. 编辑形式：展开行 vs 弹窗

两种 Web 端典型形式都提供，并允许用户在 Display options 中切换：

| 形式 | 适用 | 特点 |
| --- | --- | --- |
| **展开行（默认）** | 字段 ≤ 8、需要参照相邻记录 | 该行替换为表单（\`colSpan\` 全宽、浅蓝底），表格上下文保留；同一时刻只允许一个编辑态 |

### 必须

- 两种形式复用**同一个表单组件与校验函数**，差异只在容器。
- 打开编辑前记录触发按钮，取消/保存/关闭后焦点**回到该 Edit 按钮**。
- Edit 按钮 \`aria-expanded\`（展开行模式）或 \`aria-haspopup="dialog"\`（弹窗模式）。
- 删除按钮只出现在编辑态内部（最左侧），并经确认框。

## 7. 批量操作

- 选中 ≥ 1 行时底部居中浮现深色操作条（\`fixed; bottom: 16px\`），内容：\`n selected · Clear · Delete\`。

## 8. 窄屏退化（< 640px）

表格切换为 **卡片列表**（\`<ul>\`）：

\`\`\`
[☐] [A] www.myexample.com            ⚠   Edit
     199.168.103.236
     Proxied · TTL Auto
\`\`\`

- 第一行：复选框、类型 Badge、名称（截断）、警告、Edit。
- 第二行：内容（等宽、允许断行 \`break-all\`）。
- 第三行：次要属性以 \`·\` 分隔，自动折行。
- 编辑态在卡片内展开为单列表单。

### 为什么不是横向滚动？

横向滚动的表格在手机上几乎不可用：用户看不到最右的操作列，且滚动与页面滚动冲突。640–1023px 之间保留横向滚动（表格仍可读）；更窄时必须重排。

## 1. 断点

| 名称 | 范围 | 外壳行为 | 内容行为 |
| --- | --- | --- | --- |
| xs | < 640 | 抽屉导航 | 单列；表格 → 卡片列表；按钮纵向堆叠；Dialog 底部抽屉 |
| sm | 640–767 | 抽屉导航 | 表格横向滚动（卡片内）；6 列表单栅格 |
| md | 768–1023 | **Rail 侧边栏 + 悬停展开** | 单列设置/表单；统计 2 列 |
| lg | 1024–1279 | 侧边栏默认固定 | 12 列表单栅格；长表单出现右侧大纲 |
| xl | 1280–1535 | 同上 | 统计 4 列；Overview 2+1 栅格 |
| 2xl | ≥ 1536 | 同上 | 内容区封顶 1440px 居中 |

验证基线：**390 / 768 / 1440** 三档必须逐页检查；**320** 必须可回流；**300** 应该不溢出（允许部分文字换行、按钮全宽）。

## 2. 布局策略（按优先级）

1. **让容器伸缩**：\`flex-1 min-w-0\`、\`grid minmax(0, 1fr)\`。\`min-width: 0\` 是防止 flex/grid 子项撑破父容器的关键。
2. **让内容折行**：工具栏 \`flex-wrap\`、页脚链接 \`flex-wrap\`、chips \`flex-wrap\`。
3. **截断**：只对"可通过其它方式获得全文"的内容截断（表格单元格有 \`title\`，名称有 Tooltip）。
4. **重排**：表格 → 卡片；并列按钮 → 堆叠；双栏 → 单栏。
5. **隐藏**：仅限次要/冗余元素（顶栏"Ask AI/Support"文字按钮、步骤条标签、快捷键提示）。永不隐藏主操作。
6. **卡片内滚动**：最后手段，仅用于宽表格，且必须限制在卡片内部。

### 必须

- 页面级（\`body\`）无横向滚动。检查方式：\`document.documentElement.scrollWidth <= innerWidth\`。
- 所有文本容器允许换行；长 URL / 哈希使用 \`break-all\` 或 \`truncate\`。
- 浮层（Popover/Tooltip/Dialog）计算位置时夹紧到视口内，宽度 \`min(期望, 100vw − 16px)\`。
- 触屏（\`pointer: coarse\`）下主要命中目标 ≥ 44px；桌面 ≥ 24px。

### 应该

- 使用逻辑尺寸优先级：先 \`max-width\`，再断点覆盖。
- 图像/预览使用 \`transform: scale\` 适配而不是裁切。
- 顶栏右侧的按钮使用 \`square\` 图标按钮在窄屏保持可达。

### 避免

- 为每个断点写一套独立样式；应是"单列基线 + 渐进增强"。
- 使用固定像素宽度的表单列（除短字段如 Port 140px，且外层仍需 \`minmax(0,1fr)\`）。
- \`100vw\` 用作宽度（含滚动条会溢出），改用 \`100%\`。

## 3. 外壳的响应式细节

- 侧边栏占位宽度只有 0 / 56 / 264 三种，过渡 280ms；内容区 \`flex-1 min-w-0\`。
- 从桌面缩到移动时自动关闭 peek 与抽屉；从移动放大时关闭抽屉。
- 顶栏资源名 \`max-width: 60vw\` + \`truncate\`。

## 4. Responsive Lab（模拟工具）使用说明

路径：侧边栏 **Responsive Lab**（\`#/lab\`）。

| 功能 | 说明 |
| --- | --- |
| 宽度滑条 | 280–1600px，实时改变预览 iframe 宽度；右侧数字框可精确输入 |
| 设备预设 | 320 / 390 / 768 / 1024 / 1440 一键切换 |
| Auto sweep | 自动在 280↔1600 之间往返扫描（0.5× / 1× / 2×），\`Space\` 暂停/继续 |
| 页面选择 | 预览 DNS 表格、长表单、向导、设置、仪表盘 |
| 高度 | 560 / 720 / 900 |
| Side by side | 同时展示 390 / 768 / 1440 三档 |
| 自动缩放 | 预览比窗口宽时按比例缩小，仍以真实 CSS 像素渲染 |
| 控制区停靠 | 控制卡片默认 sticky 于顶栏下方，可取消停靠 |

实现要点：预览是同一构建产物的 \`iframe\`（URL 加 \`?frame=1\`），因此媒体查询、侧边栏状态机、浮层定位均为真实行为；父页面通过 \`contentDocument\` 同步主题，通过 \`location.hash\` 切换页面避免整页重载；\`frame\` 模式下侧边栏隐藏 "Responsive Lab" 入口以避免递归。

`,nN='# 07 · 无障碍（Accessibility）\n\n无障碍是验收底线。本篇按"必须 / 应该 / 可以 / 避免"列出规则，并给出本模拟稿中的实现位置。\n\n## 1. 键盘\n\n### 必须\n\n- 所有交互元素可通过 `Tab` 到达、`Enter/Space` 激活；顺序与视觉顺序一致。\n- 浮层打开后焦点进入浮层；关闭后焦点回到触发元素（Popover、Menu、Dialog 均实现）。\n- 模态（Dialog、移动抽屉、命令面板）具备焦点陷阱与 `Esc` 关闭。\n- 列表型浮层（Menu、命令面板）支持 `↑ ↓ Home End` 导航。\n- 折叠侧边栏在键盘聚焦时自动展开（peek），失焦收起。\n- 提供"Skip to main content"链接。\n\n### 应该\n\n- 全局快捷键不与输入冲突（输入框内不响应 `[`、`Space`）。\n- 向导换步后把焦点移到步骤标题。\n\n## 2. 焦点可见\n\n- `:focus-visible` 统一 2px 主色外描边 + 2px offset；**禁止** `outline: none` 而无替代。\n- 输入框聚焦：边框主色 + 2px 30% 主色环。\n- 自定义单选卡片用 `:has(:focus-visible)` 在整卡显示焦点环。\n\n## 3. 命中目标与间距\n\n- 桌面 ≥ 24×24px；触屏 ≥ 44×44px。复选框 16px 视觉框外包 24px 命中区；图标按钮 32/36px。\n- 相邻可点击元素间距 ≥ 4px。\n\n## 4. 对比度\n\n| 组合 | 浅色 | 深色 |\n| --- | --- | --- |\n| text / surface | 15.9:1 | 13.8:1 |\n| text-2 / surface | 8.4:1 | 9.0:1 |\n| text-3 / surface | 4.6:1 | 5.3:1 |\n| primary / surface（文字） | 7.6:1 | 7.3:1 |\n| white / primary（按钮） | 7.6:1 | — |\n| fg-inverse / primary（深色按钮） | — | 8.9:1 |\n\n- 正文、占位符、辅助文字 ≥ 4.5:1；图标与边框 ≥ 3:1。\n- 状态不仅靠颜色：错误带图标与文字，Proxied 带云朵图标 + 文字，排序带箭头 + `aria-sort`。\n\n## 5. 语义与 ARIA\n\n| 组件 | 语义 |\n| --- | --- |\n| 导航 | `<nav aria-label="Primary">`，激活项 `aria-current="page"`，分组按钮 `aria-expanded` + `aria-controls` |\n| 开关 | `<button role="switch" aria-checked>` + `aria-labelledby/-describedby` |\n| 复选框 | 原生 `<input type=checkbox>`（自定义外观），`indeterminate` 由 ref 设置 |\n| 表格 | `<caption>`、`<th scope=col>`、`aria-sort` |\n| 字段 | `<label for>`、`aria-invalid`、`aria-describedby` 指向 hint/error、错误 `role=alert` |\n| Tooltip | `role=tooltip` + 触发元素 `aria-describedby`，hover 与 focus 都能触发 |\n| Popover | `role=dialog aria-label`，触发按钮 `aria-expanded aria-haspopup` |\n| Dialog | `role=dialog aria-modal aria-labelledby aria-describedby` |\n| Toast | 容器 `role=region aria-label="Notifications"`；成功 `role=status`，错误 `role=alert` |\n| 命令面板 | `role=combobox aria-activedescendant` + `role=listbox/option` |\n| 步骤条 | `<ol aria-label="Progress">`，当前步 `aria-current="step"` |\n| 分段控件 | `role=radiogroup` + `role=radio aria-checked` |\n\n### 必须\n\n- 纯图标按钮 `aria-label`；装饰图标 `aria-hidden`。\n- 不用 `div onClick` 伪装按钮；可点击的东西就是 `<button>` 或 `<a href>`。\n- 不使用仅 hover 可达的功能：Tooltip 可聚焦触发；行操作按钮常显（非 hover 才出现）。\n\n## 6. 动效与偏好\n\n- `prefers-reduced-motion: reduce` 时所有过渡/动画时长 → 0.01ms。\n- `prefers-color-scheme` 作为"跟随系统"主题的来源，实时监听。\n- `color-scheme` 跟随主题，原生控件与滚动条随之变化。\n\n## 7. 文本与国际化\n\n- 中英混排行高 ≥ 1.6；不使用 `letter-spacing` 压缩正文。\n- 文本允许折行；不设置 `user-scalable=no`。\n- 日期/数字使用 `tabular-nums`。\n\n## 8. 验收方法\n\n1. 拔掉鼠标走一遍主要流程：新增 DNS 记录 → 编辑 → 删除 → 撤销。\n2. 浏览器缩放 200%：布局不破、无横向滚动。\n3. 开启系统"减少动态效果"：侧边栏/浮层仍可用。\n4. 使用 Lighthouse / axe 扫描：无 critical/serious 问题。\n5. 屏幕阅读器（NVDA/VoiceOver）朗读表单：标签、错误、必填状态可被读出。\n',lN=`# 08 · 部署与使用说明

## 1. 技术栈

| 项 | 选择 | 说明 |
| --- | --- | --- |
| 框架 | React 19 + TypeScript | 函数组件 + Hooks |
| 构建 | Vite 7 + \`vite-plugin-singlefile\` | 产物为单个 \`dist/index.html\`，可直接静态托管或离线打开 |
| 样式 | Tailwind CSS v4 | 令牌通过 \`@theme inline\` 映射；组件只用语义工具类 |
| 图标 | lucide-react | 单一图标库 |
| 文档渲染 | react-markdown + remark-gfm | \`docs/*.md\` 以 \`?raw\` 方式打包进应用 |
| 路由 | 自研 hash 路由 | \`#/dns/records?q=...\`，适配单文件与 iframe 预览 |

无后端：DNS 记录、列可见性、主题、侧边栏状态持久化在 \`localStorage\`，可随时清空重置。

## 2. 目录结构

\`\`\`
docs/                        设计文档（本目录）
src/
  index.css                  设计令牌、基础样式、文档排版
  lib/
    router.tsx               hash 路由 Provider / useRouter / Link
    theme.tsx                主题 Provider（light/dark/system）
    hooks.ts                 媒体查询、localStorage、点击外部、防抖…
  components/
    ui/primitives.tsx        Button Badge Field Input Select Textarea Toggle Checkbox RadioCards Segmented
    ui/overlays.tsx          Tooltip Popover Dialog Toast Menu
    ui/layout.tsx            Card* CollapsibleCard Alert PageHeader InfoTip EmptyState Stat Kbd
    ui/table.tsx             useColumnWidths（列宽状态/持久化）+ ColumnResizer（拖拽/键盘把手）
    shell/ShellContext.tsx   侧边栏状态机、快捷键
    shell/Sidebar.tsx        桌面侧边栏（pinned/rail/peek）+ 移动抽屉
    shell/TopBar.tsx         顶栏
    shell/CommandPalette.tsx 快速搜索
    shell/AppShell.tsx       外壳组合
  data/nav.ts                导航信息架构、最近访问
  data/records.ts            DNS 示例数据、类型、校验
  pages/
    OverviewPage.tsx         仪表盘 + 占位页
    dns/DnsRecordsPage.tsx   列表页综合案例
    dns/DnsRecordForm.tsx    内联表单
    forms/FormPatternsPage.tsx  长表单 + 向导
    SettingsPage.tsx         设置页
    ResponsiveLabPage.tsx    响应式模拟工具
    DocsPage.tsx             文档阅读器（左侧文档目录 + 右侧大纲）
  App.tsx                    Provider 组合与路由表
\`\`\`

## 3. 本地运行与构建

\`\`\`bash
npm install
npm run dev        # 开发服务器
npm run build      # 产出 dist/index.html（单文件）
npm run preview    # 本地预览构建产物
\`\`\`

部署：将 \`dist/index.html\` 放到任意静态托管（Cloudflare Pages、Nginx、S3、GitHub Pages）。因为是 hash 路由，不需要服务端重写规则。

> Responsive Lab 通过 \`iframe\` 加载同一 HTML（附加 \`?frame=1\`），因此需要通过 HTTP(S) 访问；直接 \`file://\` 打开时部分浏览器会阻止 iframe 访问 \`contentDocument\`（主题同步失效，但预览本身仍可用）。

## 4. 在自己的项目中复用

1. **复制令牌**：把 \`src/index.css\` 的 \`:root\` / \`[data-theme="dark"]\` / \`@theme inline\` 段落拷到你的全局样式。只改原始值，不改语义名。
2. **复制外壳**：\`components/shell/*\` 与 \`lib/hooks.ts\`、\`lib/router.tsx\`（或替换为 react-router，只需把 \`useRouter().path\` 换成 \`useLocation().pathname\`）。
3. **配置导航**：编辑 \`data/nav.ts\` 的 \`NAV\` 数组；\`group: "top" | "main" | "bottom"\` 控制分区；带 \`children\` 的项自动成为手风琴。
4. **页面骨架**：每个页面以 \`<PageHeader>\` 开始，内容放在 \`<Card>\` 中；表单字段用 \`<Field>\` 包装。
5. **校验**：按 \`validateRecord\` 的方式写纯函数，返回 \`{ field: message }\`；组件层只负责"何时显示"。

## 5. 验收清单（完整）

### 布局
- [ ] 390 / 768 / 1440 三宽逐页检查；页面级无横向滚动。
- [ ] 320px：导航抽屉、表单、表格卡片列表全部可用；300px 不溢出。
- [ ] 间距仅使用 4/8/12/16/24/32/48；圆角 ≤ 4 档；阴影 ≤ 3 级；字号 ≤ 7 档。

### 外壳
- [ ] 侧边栏 pinned ↔ rail 切换平滑；rail 悬停 ≥110ms 展开、离开 ≥220ms 收起；内容不推挤。
- [ ] 点击"Collapse"后鼠标未离开不会立即再展开。
- [ ] 键盘 Tab 进入 rail 自动展开，Esc 收起。
- [ ] 移动抽屉：遮罩/Esc/导航关闭，body 滚动锁定。
- [ ] \`Ctrl/⌘+K\` 命令面板、\`[\` 切换侧边栏。

### 表单
- [ ] 可见标签；失焦校验 + 提交汇总；首错聚焦；保留已填；允许粘贴。
- [ ] 窄屏按钮堆叠，primary 在上；Cancel 在 Save 左。
- [ ] 删除在编辑态内，确认对话框主按钮为动词；高风险需输入名称。

### 表格
- [ ] 筛选草稿/应用分离；Enter 应用；chips 可移除；显示选项持久化。
- [ ] 排序 \`aria-sort\`；全选/半选；批量操作浮条；删除后 Undo。
- [ ] 列宽可拖拽（有 min/max），键盘可调，双击/一键还原，拖动结束才持久化。
- [ ] Edit 列 sticky 常驻；横向滚动时出现分隔阴影；悬停/选中态背景不透明一致。
- [ ] 展开行 / 弹窗两种编辑形式可切换，复用同一表单；关闭后焦点回到 Edit 按钮。
- [ ] < 640px 切换为卡片列表。

### 侧边栏 Rail
- [ ] 56px 带内图标水平居中；折叠态零文字泄露（含徽标、快捷键）。
- [ ] 隐藏文字不可聚焦、不被读屏朗读。

### 主题与无障碍
- [ ] 浅色 / 深色 / 跟随系统；系统切换实时生效；无闪烁。
- [ ] 焦点环可见；无 \`outline:none\` 无替代；无 \`div onClick\`。
- [ ] 对比度 ≥ 4.5:1；命中目标 ≥ 24px（触屏 44px）。
- [ ] \`prefers-reduced-motion\` 生效。

### 性能
- [ ] 搜索防抖；过滤排序 memo；列表 key 稳定。
- [ ] 浮层只在打开时挂载；Tooltip/Popover 使用 Portal，不触发父级重排。
- [ ] 构建产物单文件 ≤ 500KB gzip 前（文档内嵌）。

## 6. 已知限制

- 示例数据与"保存"均为本地模拟（350–600ms 延迟），刷新后保留在 \`localStorage\`。
- Responsive Lab 与主页面共享 \`localStorage\`，在预览中切换侧边栏固定状态会在下次加载时影响主页面。
- 命令面板的 "Ask AI" 仅为入口示意。
